            let status="",statusColor="#64748b",rowBg="";
            if(achieved){ status="達成"; statusColor="#059669"; rowBg="#f0fdf4"; }
            else if(g.daysLeft===null){ status="期限未設定"; statusColor="#94a3b8"; }
            else if(g.daysLeft<0){ status=`超過${-g.daysLeft}日`; statusColor="#dc2626"; rowBg="#fef2f2"; }
            else if(g.daysLeft<=30){ status=`残${g.daysLeft}日`; statusColor="#ea580c"; rowBg="#fff7ed"; }
            else { status=`残${g.daysLeft}日`; statusColor="#0891b2"; }
            const tr=tb.insertRow();
            if(rowBg) tr.style.background=rowBg;
            tr.innerHTML=`<td style="font-size:11px">${g.domain==="cieds"?"CIEDs":"ABL"}</td>
              <td style="font-size:11px">${g.proc}</td>
              <td style="font-size:11px">${g.maker}</td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.current}">${g.current}</span></td>

              <td style="font-size:11px;text-align:center">
                <div style="background:#e2e8f0;border-radius:8px;height:14px;position:relative;overflow:hidden;min-width:56px">
                  <div style="background:${achieved?'#059669':g.rate>=70?'#0891b2':g.rate>=40?'#ca8a04':'#dc2626'};height:100%;width:${Math.min(g.rate,100)}%"></div>
                  <span style="position:absolute;top:0;left:0;right:0;font-size:9px;line-height:14px;font-weight:700;color:#1a1a2e">${g.rate}%</span>
                </div>
              </td>
              <td style="font-size:10px;white-space:nowrap">${g.deadline||"—"}</td>
              <td style="font-size:10px;font-weight:600;color:${statusColor};white-space:nowrap">${status}</td>`;
          });
          content.appendChild(tbl);
        }
        const achievedCnt=goals.filter(g=>g.current>=g.target).length;
        const badge=goals.length
          ? `<span style="font-size:11px;background:#eff6ff;color:#1d4ed8;padding:1px 8px;border-radius:4px">${achievedCnt}/${goals.length} 達成</span>`
          : `<span style="font-size:11px;color:#94a3b8">目標なし</span>`;
        body.appendChild(makeStaffCard(p.name,content,badge));
      });

    // ── ⑥ 症例数×スコア相関 ─────────────────
    else if(curView==="corr"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="症例数とスコアの関係を散布図で可視化。「何件でスコアが上がるか」の目安になります。";
      body.appendChild(note);

      ["cieds","abl"].forEach(domain=>{
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
        const pts=[];
        S.staff.forEach(p=>{
          procs.forEach(proc=>{
            makers.forEach(m=>{
              if(domain==="cieds"&&!ciedsValid(proc,m))return;
              if(domain==="abl"&&!proc.sys.includes(m))return;
              const cases=getLatestYearCases(p.leader?.cases,domain,proc.id,m,p.leader?.monthlyCases);
              const score=calcSkillScore(p.leader,domain,proc.id,m,p,false);
              if(cases>0||score>0) pts.push({cases,score,name:p.name,label:`${proc.label}×${m}`});

          });
        });

        const sec=document.createElement("div");sec.style.marginBottom="24px";
        const h=document.createElement("div");
        h.style.cssText="font-weight:700;font-size:13px;color:#1a1a2e;margin-bottom:8px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:4px solid #0f3460";
        h.textContent=domain==="cieds"?"CIEDs（デバイス）":"ABL（アブレーション）";
        sec.appendChild(h);

        if(!pts.length){
          const nd=document.createElement("div");
          nd.style.cssText="padding:12px;color:#94a3b8;font-size:12px";
          nd.textContent="データなし";
          sec.appendChild(nd);
          body.appendChild(sec);return;
        }

        // 散布図SVG
        const W=560,H=280,padL=44,padB=44,padT=24,padR=16;
        const cw=W-padL-padR,ch=H-padT-padB;
        const maxCases=Math.max(...pts.map(p=>p.cases),20);
        let dots="";
        pts.forEach(p=>{
          const x=padL+(p.cases/maxCases)*cw;
          const y=padT+ch*(1-p.score/7);
          const col=p.score>=5?"#059669":p.score>=3?"#ca8a04":"#dc2626";
          dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}" fill-opacity="0.6" stroke="${col}" stroke-width="1"><title>${p.name} ${p.label}: ${p.cases}件 → スコア${p.score}</title></circle>`;
        });
        // 10件ライン（キャップ基準）
        const capX=padL+(10/maxCases)*cw;
        const capLine=`<line x1="${capX.toFixed(1)}" y1="${padT}" x2="${capX.toFixed(1)}" y2="${H-padB}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="${capX.toFixed(1)}" y="${padT-4}" text-anchor="middle" font-size="9" fill="#dc2626">10件（キャップ）</text>`;
        // グリッド
        const yGrid=[0,2,4,6,7].map(v=>{const y=padT+ch*(1-v/7);return`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e2e8f0"/><text x="${padL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${v}</text>`;}).join("");
        const xTicks=[0,.25,.5,.75,1].map(r=>{const x=padL+cw*r;const v=Math.round(maxCases*r);return`<text x="${x.toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="#94a3b8">${v}</text>`;}).join("");

        const svgWrap=document.createElement("div");svgWrap.style.overflowX="auto";
        svgWrap.innerHTML=`<svg width="${W}" height="${H}" style="font-family:sans-serif;display:block">
<text x="${W/2}" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">症例数（横）× スコア（縦）</text>
<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
${yGrid}${xTicks}${capLine}${dots}
<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="#64748b">直近1年のメイン件数</text></svg>`;
        sec.appendChild(svgWrap);

        // 統計サマリ
        const withCases=pts.filter(p=>p.cases>=10);
        const avgScore=withCases.length?(withCases.reduce((s,p)=>s+p.score,0)/withCases.length).toFixed(1):"—";
        const under=pts.filter(p=>p.cases<10);
        const avgUnder=under.length?(under.reduce((s,p)=>s+p.score,0)/under.length).toFixed(1):"—";
        const stat=document.createElement("div");
        stat.style.cssText="font-size:11px;color:#374151;padding:8px 12px;background:#f8fafc;border-radius:6px;margin-top:8px";
        stat.innerHTML=`10件以上の平均スコア：<b>${avgScore}</b>　／　10件未満の平均スコア：<b>${avgUnder}</b>　（データ数 ${pts.length}）`;
        sec.appendChild(stat);
        body.appendChild(sec);
      });

    // ── ⑦ 変更ログ ──────────────────────────
    else if(curView==="audit"){
      buildAuditLog(body);

    // ── ⑨ 症例配分バランス ─────────────────
    else if(curView==="balance"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:10px;line-height:1.8";
      note.innerHTML=`育成メンバー内での症例配分の偏りを検出します。特定の人に集中していると習熟に差が出ます。<br>
        教育担当（${INSTRUCTORS.join("・")}）は指導側のため偏りの計算から除外し、参考として別枠に表示します。<br>
        <span style="color:#94a3b8">育成メンバー：${TRAINEES.join("・")}</span>`;
      body.appendChild(note);

      let balDomain="abl", balPeriod="year";
      const ctrl=document.createElement("div");
      ctrl.style.cssText="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:6px 10px;background:#f8fafc;border-radius:8px";
      const resWrap=document.createElement("div");

      function mkSeg(label,opts,getCur,setCur){
        const wrap=document.createElement("div");
        wrap.style.cssText="display:flex;align-items:center;gap:4px";
        const lb=document.createElement("span");
        lb.style.cssText="font-size:10px;color:#94a3b8;font-weight:700;margin-right:2px";
        lb.textContent=label; wrap.appendChild(lb);
        opts.forEach(([id,txt])=>{
          const b=document.createElement("button");
          b.textContent=txt;
          const act=getCur()===id;
          b.style.cssText=`font-size:11px;padding:3px 10px;border-radius:6px;cursor:pointer;font-weight:600;background:${act?'#0f3460':'#fff'};color:${act?'#fff':'#64748b'};border:1px solid ${act?'#0f3460':'#e2e8f0'}`;
          b.addEventListener("click",()=>{
            setCur(id);
            wrap.querySelectorAll("button").forEach(x=>{x.style.background="#fff";x.style.color="#64748b";x.style.border="1px solid #e2e8f0";});
            b.style.background="#0f3460";b.style.color="#fff";b.style.border="1px solid #0f3460";
            drawBalance();
          });
          wrap.appendChild(b);
        });
        return wrap;
      }
      ctrl.appendChild(mkSeg("対象",[["abl","ABL"],["cieds","CIEDs"],["all","全体"]],()=>balDomain,v=>{balDomain=v;}));
      ctrl.appendChild(mkSeg("期間",[["year",CY+"年"],["m6","直近6ヶ月"],["m3","直近3ヶ月"],["m1","直近1ヶ月"]],()=>balPeriod,v=>{balPeriod=v;}));
      body.appendChild(ctrl);
      body.appendChild(resWrap);

      function drawBalance(){
        resWrap.innerHTML="";
        const doms = balDomain==="all"?["cieds","abl"]:[balDomain];
        const today=new Date();
        const MONTH_SPANS={m1:1,m3:3,m6:6};
        const nMonths=MONTH_SPANS[balPeriod]||0;
        const isMonthly=nMonths>0;
        function monthKeyBack(back){
          const d=new Date(today.getFullYear(), today.getMonth()-back, 1);
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
        }
        const cutoff=isMonthly?monthKeyBack(nMonths-1):"";
        const thisMonth=monthKeyBack(0);
        const periodLabel = isMonthly
          ? (nMonths===1?`直近1ヶ月（${thisMonth}）`:`直近${nMonths}ヶ月（${cutoff}〜${thisMonth}）`)
          : `${CY}年`;

        const stats=S.staff.map(p=>{
          let mainN=0, subN=0;
          if(isMonthly){
            const mc=p.leader?.monthlyCases||{};
            Object.entries(mc).forEach(([mo,md])=>{
              if(!/^\d{4}-\d{2}$/.test(mo)||mo<cutoff)return;
              doms.forEach(dm=>Object.values(md?.[dm]||{}).forEach(v=>{
                mainN+=parseInt(v?.main||0)||0; subN+=parseInt(v?.sub||0)||0;
              }));
            });
          }else{
            const yr=p.leader?.cases?.[CY]||{};
            doms.forEach(dm=>Object.values(yr?.[dm]||{}).forEach(v=>{
              mainN+=parseInt(v?.main||0)||0; subN+=parseInt(v?.sub||0)||0;
            }));
          }
          const exp=(p.caseLog||[]).reduce((s2,l)=>{
            if(l.role!=="メイン")return s2;
            if(!l.date)return s2;
            if(isMonthly){ if(l.date.slice(0,7)<cutoff)return s2; }
            else { if(l.date.slice(0,4)!==CY)return s2; }
            if(balDomain!=="all"&&l.domain!==balDomain)return s2;
            const d=CASE_DIFFICULTY.find(x=>x.id===l.difficulty);
            return s2+(d?d.weight:1);
          },0);
          return {name:p.name, mainN, subN, total:mainN+subN, exp,
                  group:isInstructor(p.name)?"instructor":isTrainee(p.name)?"trainee":"other"};
        });

        let trainees=stats.filter(s2=>s2.group==="trainee");
        const instrs =stats.filter(s2=>s2.group==="instructor");
        const others =stats.filter(s2=>s2.group==="other" && (s2.total>0||s2.exp>0));
        // 育成メンバーが名簿に存在しない場合のフォールバック
        if(!trainees.length){
          trainees=stats.filter(s2=>s2.group==="other" && (s2.total>0||s2.exp>0));
        }

        if(!trainees.length){
          const nd=document.createElement("div");
          nd.style.cssText="padding:20px;text-align:center;color:#94a3b8;font-size:13px";
          nd.textContent="育成メンバーの登録がありません";
          resWrap.appendChild(nd);
          return;
        }

        const tTotal=trainees.reduce((a,b)=>a+b.mainN,0);
        if(!tTotal){
          const nd=document.createElement("div");
          nd.style.cssText="padding:20px;text-align:center;color:#94a3b8;font-size:13px";
          nd.textContent=`${periodLabel}の症例データがありません`;
          resWrap.appendChild(nd);
          return;
        }

        trainees.sort((a,b)=>b.mainN-a.mainN);
        const avgMain=tTotal/trainees.length;
        const maxMain=Math.max(...trainees.map(s2=>s2.mainN));
        const minMain=Math.min(...trainees.map(s2=>s2.mainN));
        const maxTotal=Math.max(...trainees.map(s2=>s2.total),1);
        const ratio = minMain>0 ? maxMain/minMain : null;

        // ジニ係数（育成メンバーのみ）
        const gini=(()=>{
          const vals=trainees.map(s2=>s2.mainN).sort((a,b)=>a-b);
          const n=vals.length, tot=vals.reduce((a,v)=>a+v,0);
          if(!tot||n<2)return 0;
          let cum=0;
          vals.forEach((v,i)=>{cum+=(2*(i+1)-n-1)*v;});
          return cum/(n*tot);
        })();
        const giniLabel = gini<0.2?"均等":gini<0.35?"やや偏り":gini<0.5?"偏りあり":"強い偏り";
        const giniColor = gini<0.2?"#059669":gini<0.35?"#ca8a04":gini<0.5?"#ea580c":"#dc2626";

        const sum=document.createElement("div");
        sum.style.cssText="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px";
        sum.innerHTML=`
          <div style="background:#f8fafc;border-radius:8px;padding:8px 14px">
            <div style="font-size:9px;color:#64748b">育成メンバー</div>
            <div style="font-size:18px;font-weight:800;color:#1a1a2e">${trainees.length}名</div>
            <div style="font-size:9px;color:#94a3b8">${periodLabel}</div>
          </div>
          <div style="background:#f8fafc;border-radius:8px;padding:8px 14px">
            <div style="font-size:9px;color:#64748b">メイン平均</div>
            <div style="font-size:18px;font-weight:800;color:#1d4ed8">${avgMain.toFixed(1)}件</div>
            <div style="font-size:9px;color:#94a3b8">合計${tTotal}件</div>
          </div>
          <div style="background:#f8fafc;border-radius:8px;padding:8px 14px">
            <div style="font-size:9px;color:#64748b">最多 / 最少</div>
            <div style="font-size:18px;font-weight:800;color:#1a1a2e">${maxMain} / ${minMain}</div>
            <div style="font-size:9px;color:#94a3b8">${ratio!==null?`最多は最少の${ratio.toFixed(1)}倍`:"最少が0件"}</div>
          </div>
          <div style="background:${giniColor}15;border-radius:8px;padding:8px 14px;border-left:3px solid ${giniColor}">
            <div style="font-size:9px;color:#64748b">配分の偏り</div>
            <div style="font-size:18px;font-weight:800;color:${giniColor}">${giniLabel}</div>
            <div style="font-size:9px;color:#94a3b8">ジニ係数 ${gini.toFixed(2)}（教育担当を除く）</div>
          </div>`;
        resWrap.appendChild(sum);

        function barRow(s2,muted){
          const row=document.createElement("div");
          row.style.cssText="display:flex;align-items:center;gap:8px";
          const isLow = !muted && s2.mainN < avgMain*0.5;
          const isHigh= !muted && s2.mainN > avgMain*1.5;
          const col = muted?"#94a3b8":isLow?"#dc2626":isHigh?"#0891b2":"#059669";
          const w = Math.max(maxTotal, s2.total, 1);
          row.innerHTML=`
            <span style="font-size:11px;font-weight:600;min-width:84px;color:${muted?'#64748b':'#1a1a2e'}">${s2.name}</span>
            <div style="flex:1;display:flex;height:20px;border-radius:4px;overflow:hidden;background:#f1f5f9;min-width:120px">
              <div style="background:${col};width:${s2.mainN/w*100}%;display:flex;align-items:center;justify-content:flex-end;padding-right:4px">
                ${s2.mainN>0?`<span style="font-size:9px;color:#fff;font-weight:700">${s2.mainN}</span>`:""}
              </div>
              <div style="background:#cbd5e1;width:${s2.subN/w*100}%;display:flex;align-items:center;justify-content:flex-end;padding-right:4px">
                ${s2.subN>0?`<span style="font-size:9px;color:#374151">${s2.subN}</span>`:""}
              </div>
            </div>
            <span style="font-size:10px;color:#059669;font-weight:600;min-width:48px;text-align:right">経験値${s2.exp.toFixed(1)}</span>
            ${isLow?'<span style="font-size:9px;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:4px;white-space:nowrap">少ない</span>':isHigh?'<span style="font-size:9px;background:#eff6ff;color:#0891b2;padding:1px 6px;border-radius:4px;white-space:nowrap">多い</span>':'<span style="min-width:0"></span>'}`;
          return row;
        }

        function block(title,list,muted,emptyMsg){
          const sec=document.createElement("div");
          sec.style.marginBottom="16px";
          const hd=document.createElement("div");
          hd.style.cssText=`font-size:11px;font-weight:700;color:${muted?'#64748b':'#1a1a2e'};margin-bottom:6px;padding:4px 8px;background:${muted?'#f8fafc':'#eef2f7'};border-radius:4px`;
          hd.textContent=title;
          sec.appendChild(hd);
          if(!list.length){
            const e=document.createElement("div");
            e.style.cssText="font-size:11px;color:#94a3b8;padding:4px 8px";
            e.textContent=emptyMsg;
            sec.appendChild(e);
            return sec;
          }
          const chart=document.createElement("div");
          chart.style.cssText="display:flex;flex-direction:column;gap:6px";
          list.forEach(s2=>chart.appendChild(barRow(s2,muted)));
          sec.appendChild(chart);
          return sec;
        }

        resWrap.appendChild(block("育成メンバー（偏りの計算対象）",trainees,false,"該当なし"));
        resWrap.appendChild(block("教育担当（計算対象外・参考）",instrs.sort((a,b)=>b.mainN-a.mainN),true,"該当なし"));
        if(others.length) resWrap.appendChild(block("その他スタッフ（計算対象外・参考）",others.sort((a,b)=>b.mainN-a.mainN),true,"該当なし"));

        const legend=document.createElement("div");
        legend.style.cssText="font-size:10px;color:#64748b;display:flex;gap:12px;flex-wrap:wrap";
        legend.innerHTML=`<span><span style="display:inline-block;width:10px;height:10px;background:#059669;border-radius:2px"></span> メイン</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:#cbd5e1;border-radius:2px"></span> 外回り</span>
          <span>※ 「少ない」「多い」は育成メンバーの平均${avgMain.toFixed(1)}件に対する±50%の判定</span>
          <span>※ ${periodLabel}の集計　※ 経験値は症例ログから算出</span>`;
        resWrap.appendChild(legend);
      }

      drawBalance();
    }

  }

  tabBar.style.cssText="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:8px 10px;background:#f8fafc;border-radius:8px";
  viewGroups.forEach(g=>{
    const grp=document.createElement("div");
    grp.style.cssText="display:flex;align-items:center;gap:4px";
    const lb=document.createElement("span");
    lb.style.cssText="font-size:10px;color:#94a3b8;font-weight:700;margin-right:2px";
    lb.textContent=g.label;
    grp.appendChild(lb);
    g.items.forEach(([id,label])=>{
      const btn=document.createElement("button");
      btn.textContent=label;
      const act=id===curView;
      btn.style.cssText=`font-size:11px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-weight:600;background:${act?'#0f3460':'#fff'};color:${act?'#fff':'#64748b'};border:1px solid ${act?'#0f3460':'#e2e8f0'}`;
      btn.addEventListener("click",()=>{
        curView=id;
        tabBar.querySelectorAll("button").forEach(b=>{b.style.background="#fff";b.style.color="#64748b";b.style.border="1px solid #e2e8f0";});
        btn.style.background="#0f3460";btn.style.color="#fff";btn.style.border="1px solid #0f3460";
        drawView();
      });
      grp.appendChild(btn);
    });
    tabBar.appendChild(grp);
  });

  drawView();
  container.appendChild(tabBar);
  container.appendChild(body);
}

// ═══════════════════════════════════════════════════════
// PDF出力（棒グラフ＋レーダーをSVGで生成）
// ═══════════════════════════════════════════════════════


function printReport(idx){
  const p=S.staff[idx];
  const canSee=ROLE==="leader"||ROLE==="admin"||ROLE==="creator";
  const isAdmin=ROLE==="admin"||ROLE==="creator";
  const today=new Date();

  // ── 共通SVGヘルパー ──────────────────────

  // ── データ集計 ────────────────────────
  const logs=p.caseLog||[];
  const stAll=calcExpStats(logs), stAbl=calcExpStats(logs,"abl"), stCie=calcExpStats(logs,"cieds");
  const dlA=diffLabel(stAbl.avgDiff);
  let indep=0, totalCombo=0;
  ["cieds","abl"].forEach(domain=>{
    const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
    const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
    procs.forEach(proc=>makers.forEach(m=>{
      if(domain==="cieds"&&!ciedsValid(proc,m))return;
      if(domain==="abl"&&!proc.sys.includes(m))return;
      totalCombo++;
      if(calcSkillScore(p.leader,domain,proc.id,m,p,false)>=5)indep++;
    }));
  });

  // ── ① スキルレーダー ───────────────────
  function skillRadars(){
    return ["cieds","abl"].map(domain=>{
      const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
      const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
      const axes=procs.map(pr=>pr.label);
      function avgBy(evalObj,isSelf){
        return procs.map(pr=>{
          const vals=makers.filter(m=>domain==="cieds"?ciedsValid(pr,m):pr.sys.includes(m))
            .map(m=>calcSkillScore(evalObj,domain,pr.id,m,p,isSelf));
          return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;
        });
      }
      const ds=[{label:"自己評価",color:"#3b82f6",values:avgBy(p.self,true)}];
      if(canSee) ds.push({label:"リーダー評価",color:"#059669",values:avgBy(p.leader,false)});
      const goals=procs.map(pr=>{
        const vals=makers.filter(m=>domain==="cieds"?ciedsValid(pr,m):pr.sys.includes(m))
          .map(m=>p.admin?.[domain]?.[`${m}_${pr.id}`]?.target||0);
        const nz=vals.filter(v=>v>0);
        return nz.length?nz.reduce((s,v)=>s+v,0)/nz.length:0;
      });
      if(goals.some(v=>v>0)) ds.push({label:"上層部目標",color:"#dc2626",values:goals,dash:true});
      return radarSVG(domain==="cieds"?"CIEDs":"ABL",axes,ds,240);
    }).join("");
  }

  // ── ①-2 未チェック項目 ──────────────────
  function uncheckedSection(){
    let html="";
    // 進捗サマリ
    html+=`<div class="card-grid">`;
    UNCHECKED_DOMAINS.forEach(([dm,dl])=>{
      const ps=checkProgress(p,dm,"self");
      const pl=checkProgress(p,dm,"leader");
      html+=`<div class="card" style="background:#f8fafc;border-left:4px solid #64748b">
        <div class="card-title" style="color:#334155">${dl}</div>
        <div class="stat-row">
          <div class="stat"><div class="stat-label">自己 未チェック</div><div class="stat-value" style="color:#3b82f6">${ps.total-ps.done}</div><div class="stat-sub">全${ps.total}項目 / 達成${(ps.rate*100).toFixed(0)}%</div></div>
          ${canSee?`<div class="stat"><div class="stat-label">リーダー 未チェック</div><div class="stat-value" style="color:#059669">${pl.total-pl.done}</div><div class="stat-sub">全${pl.total}項目 / 達成${(pl.rate*100).toFixed(0)}%</div></div>`:""}
        </div></div>`;
    });
    html+=`</div>`;

    UNCHECKED_DOMAINS.forEach(([dm,dl])=>{
      const groups=collectUnchecked(p,dm,canSee);
      html+=`<h3>${dl} 未チェック項目</h3>`;
      if(!groups.length){ html+=`<div style="font-size:10px;color:#059669;margin-bottom:8px">未チェック項目はありません</div>`; return; }
      // 件数表
      html+=`<table style="margin-bottom:6px"><thead><tr>
        <th style="font-size:8px">術式</th><th style="font-size:8px">共通</th><th style="font-size:8px">メーカー固有</th><th style="font-size:8px">計</th></tr></thead><tbody>`;
      groups.forEach(g=>{
        html+=`<tr><td style="font-size:9px">${g.procLabel}</td>
          <td style="text-align:center;font-size:9px">${g.nCommon}</td>
          <td style="text-align:center;font-size:9px">${g.nSpec}</td>
          <td style="text-align:center;font-size:9px;font-weight:700;color:#dc2626">${g.nCommon+g.nSpec}</td></tr>`;
      });
      html+=`</tbody></table>`;
      // 明細
      function tag(it){
        return `${it.selfNG?'<span style="background:#dbeafe;color:#1d4ed8;font-size:7px;font-weight:700;padding:0 3px;border-radius:2px;margin-right:2px">自己</span>':""}${it.ldNG?'<span style="background:#dcfce7;color:#059669;font-size:7px;font-weight:700;padding:0 3px;border-radius:2px;margin-right:2px">リーダー</span>':""}`;
      }
      groups.forEach(g=>{
        html+=`<div style="border:1px solid #e2e8f0;border-radius:4px;padding:5px 8px;margin-bottom:5px;page-break-inside:avoid">
          <div style="font-size:9px;font-weight:700;color:#1a1a2e;margin-bottom:2px">${g.procLabel}　<span style="color:#dc2626">未チェック ${g.nCommon+g.nSpec}</span></div>`;
        if(g.common.length){
          html+=`<div style="font-size:8px;font-weight:700;color:#64748b;margin:2px 0 1px">共通項目</div>`;
          html+=g.common.map(it=>`<div style="font-size:8.5px;color:#374151;line-height:1.55">${tag(it)}${it.text}</div>`).join("");
        }
        g.makers.forEach(mk=>{
          html+=`<div style="font-size:8px;font-weight:700;color:#7c3aed;margin:4px 0 1px">${mk.maker} 固有項目</div>`;
          html+=mk.items.map(it=>`<div style="font-size:8.5px;color:#374151;line-height:1.55">${tag(it)}${it.text}</div>`).join("");
        });
        html+=`</div>`;
      });
    });
    html+=`<div style="font-size:8px;color:#94a3b8;margin-bottom:8px">※ 共通項目は術式ごとに1回表示（全メーカー共通）。上の件数表・進捗率はスコア計算と同じ数え方（共通項目をメーカーごとに計上）のため一致しません。</div>`;
    return html;
  }

  // ── ② 経験値サマリ ────────────────────
  function expSummary(){
    if(!stAll.total) return `<div style="font-size:10px;color:#94a3b8">症例ログの記録がありません</div>`;
    let html=`<div class="card-grid">`;
    [["ABL",stAbl,"#7c3aed","#f5f3ff"],["CIEDs",stCie,"#1d4ed8","#eff6ff"]].forEach(([nm,st,col,bg])=>{
      const dl=diffLabel(st.avgDiff);
      html+=`<div class="card" style="background:${bg};border-left:4px solid ${col}">
        <div class="card-title" style="color:${col}">${nm}</div>
        <div class="stat-row">
          <div class="stat"><div class="stat-label">メイン件数</div><div class="stat-value" style="color:#1a1a2e">${st.mainN}</div></div>
          <div class="stat"><div class="stat-label">経験値</div><div class="stat-value" style="color:${col}">${st.exp.toFixed(1)}</div></div>
          <div class="stat"><div class="stat-label">平均難易度</div><div class="stat-value" style="color:${dl.color}">${st.avgDiff>0?st.avgDiff.toFixed(2):"—"}</div><div class="stat-sub" style="color:${dl.color}">${st.avgDiff>0?dl.text:""}</div></div>
        </div>`;
      if(st.mainN){
        const bd=st.breakdown.filter(b=>b.count);
        html+=`<div style="font-size:8px;color:#64748b;margin-bottom:3px">難易度の内訳（メイン症例）</div>
        <div style="display:flex;height:16px;border-radius:3px;overflow:hidden;background:#e2e8f0;margin-bottom:4px">
          ${bd.map(b=>`<div style="background:${b.color};width:${b.count/st.mainN*100}%;display:flex;align-items:center;justify-content:center">${b.count/st.mainN>0.12?`<span style="font-size:8px;color:#fff;font-weight:700">${b.count}</span>`:""}</div>`).join("")}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${st.breakdown.map(b=>`<span style="display:inline-flex;align-items:center;gap:2px;font-size:8px;color:#374151"><span style="width:7px;height:7px;background:${b.color};border-radius:2px;display:inline-block"></span>${b.label} ${b.count}件</span>`).join("")}
        </div>`;
      }else{
        html+=`<div style="font-size:9px;color:#94a3b8">メイン症例の記録がありません</div>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
    // 解釈ヒント
    if(stAbl.mainN>=3){
      const dl=diffLabel(stAbl.avgDiff);
      let msg="";
      if(stAbl.avgDiff<1.15) msg="標準症例が中心です。複雑症例（VT・Brugada）の経験を増やすと習熟が進みます。";
      else if(stAbl.avgDiff<1.40) msg="やや標準寄りです。AF redoやAT・PSVTなどの経験を積み重ねている段階です。";
      else if(stAbl.avgDiff<1.65) msg="標準と複雑がバランスよく含まれています。";
      else msg="複雑症例の比重が高く、難易度の高い経験を積んでいます。";
      html+=`<div style="font-size:9px;color:#64748b;background:#f8fafc;border-radius:6px;padding:7px 10px;line-height:1.6">
        <b style="color:${dl.color}">ABL平均難易度 ${stAbl.avgDiff.toFixed(2)}（${dl.text}）</b>　${msg}<br>
        <span style="color:#94a3b8">※ 経験値＝メイン症例の難易度加重合計　平均難易度＝経験値÷メイン件数（1.0=標準のみ、2.0=複雑のみ）</span></div>`;
    }
    return html;
  }

  // ── ③ 症例の内訳ドーナツ ──────────────
  function caseDonuts(){
    if(!logs.length) return `<div style="font-size:10px;color:#94a3b8">症例ログの記録がありません</div>`;
    const periods=casePeriods(logs);
    let html="";
    periods.forEach((per,pi)=>{
      if(!per.logs.length) return;
      const withMaker = per.key==="all" || per.key==="year";
      const blocks=caseBreakdownData(per.logs, withMaker);
      // 期間ブロック全体をまとめてページ分割の対象外にする
      html+=`${pi>0?'<div style="height:6px"></div>':''}<div class="keep">
      <div style="background:#0f3460;color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;margin:10px 0 6px;page-break-after:avoid">
        ${per.label}　${per.logs.length}件</div>`;
      blocks.forEach(bd=>{
        // 術式ブロック単位でもページをまたがせない（期間ブロックが1ページに収まらない場合の保険）
        html+=`<div class="keep"><div style="font-size:9px;font-weight:700;color:${bd.color};margin:6px 0 3px">${bd.label}（${bd.count}件）</div>
        <div class="graph-row" style="gap:6px">`;
        bd.sets.forEach(s=>{
          if(s.items) html+=donutSVG(s.title,s.items,120);
          else html+=`<div style="font-size:8px;color:#94a3b8;padding:16px;min-width:110px;text-align:center">${s.title.replace("（術式別）","")}：記録なし</div>`;
        });
        html+=`</div>`;
        if(bd.makerBars){
          html+=`<div class="graph-row" style="gap:8px">`;
          bd.makerBars.forEach(mb=>{ html+=hBarSVG(mb.title, mb.items, 250); });
          html+=`</div>`;
        }
        html+=`</div>`;
      });
      html+=`</div>`;
    });
    return html;
  }

  // ── ④ スキルスコア推移 ────────────────
  function scoreTrend(){
    if(!canSee) return "";
    const dateSet=new Set();
    ["cieds","abl"].forEach(dm=>{
      const hist=p.scoreHistory?.leader?.[dm]||{};
      Object.values(hist).forEach(arr=>{ if(Array.isArray(arr)) arr.forEach(h=>dateSet.add(h.date)); });
    });
    const dates=[...dateSet].sort();
    if(dates.length<2) return `<div style="font-size:10px;color:#94a3b8">履歴データ不足</div>`;
    const totals=dates.map(d=>{
      let sum=0;
      ["cieds","abl"].forEach(dm=>{
        const hist=p.scoreHistory?.leader?.[dm]||{};
        Object.values(hist).forEach(arr=>{
          if(!Array.isArray(arr)||!arr.length)return;
          let latest=0; arr.forEach(h=>{ if(h.date<=d) latest=h.score; });
          sum+=latest;
        });
      });
      return sum;
    });
    return multiLineSVG("リーダー評価スコアの合計推移",dates.map(d=>d.slice(5)),[{label:"合計スコア",color:"#059669",values:totals}],660,180);
  }

  // ── ⑤ 症例数推移 ──────────────────────
  function caseTrend(){
    const mc=p.leader?.monthlyCases||{};
    const months=Object.keys(mc).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();
    if(!months.length) return `<div style="font-size:10px;color:#94a3b8">月別データなし</div>`;
    function mv(dm,f){return months.map(mo=>{let n=0;Object.values(mc[mo]?.[dm]||{}).forEach(v=>{n+=parseInt(v?.[f]||0)||0;});return n;});}
    const xL=months.map(m=>m.slice(5)+"月");
    return `<div class="graph-row">
      ${multiLineSVG("月別メイン症例数",xL,[{label:"CIEDs",color:"#1d4ed8",values:mv("cieds","main")},{label:"ABL",color:"#7c3aed",values:mv("abl","main")}],330,165)}
      ${multiLineSVG("月別 外回り症例数",xL,[{label:"CIEDs",color:"#93c5fd",values:mv("cieds","sub")},{label:"ABL",color:"#c4b5fd",values:mv("abl","sub")}],330,165)}
    </div>`;
  }

  // ── 年度別症例数表 ───────────────────
  function casesTable(domain,procs,makers,title){
    const lc=p.leader.cases||{};
    const yrs=Object.keys(lc).filter(k=>/^\d{4}$/.test(k)).sort().slice(-3);
    if(!yrs.length)return"";
    return yrs.map(y=>`<h3>${title} — ${y}年度</h3>
    <table><thead><tr><th style="font-size:8px">術式</th>${makers.map(m=>`<th colspan="2" style="font-size:8px">${m}<br><span style="font-weight:400">M/外</span></th>`).join("")}</tr></thead><tbody>
    ${procs.map(proc=>`<tr><td style="font-size:9px">${proc.label}</td>${makers.map(m=>{
      const valid=domain==="abl"?proc.sys.includes(m):ciedsValid(proc,m);
      if(!valid)return`<td colspan="2" style="text-align:center;color:#cbd5e1">—</td>`;
      const v=lc[y]?.[domain]?.[`${m}_${proc.id}`]||{};
      return`<td style="text-align:center;font-size:9px">${v.main||"−"}</td><td style="text-align:center;font-size:9px;color:#64748b">${v.sub||"−"}</td>`;
    }).join("")}</tr>`).join("")}
    </tbody></table>`).join("");
  }

  // ── ⑥ 学習活動 ────────────────────────
  function eduSection(){
    function matchSem(semName){
      return semName===p.name || p.name.includes(semName.split(/[\s　]/)[0]) || semName.includes(p.name.split(/[\s　]/)[0]);
    }
    const myRecs=(SEMINAR_DATA||[]).filter(r=>matchSem(r.name));
    const pres=myRecs.filter(r=>r.presented==='あり'||r.presented==='座長/コメンテーター');
    if(!myRecs.length) return `<div style="font-size:10px;color:#94a3b8">勉強会記録なし</div>`;
    const yrCount={};

  function goalSection(){
    const goals=[];
    ["cieds","abl"].forEach(domain=>{
      const g=p.admin?.[domain]||{};
      Object.entries(g).forEach(([key,gv])=>{
        if(!gv?.target||gv.target===0)return;
        const [maker,...pp]=key.split("_");
        const procId=pp.join("_");
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const proc=procs.find(x=>x.id===procId);
        if(!proc)return;
        const cur=calcSkillScore(p.leader,domain,procId,maker,p,false);
        let daysLeft=null;
        if(gv.deadline){const dl=new Date(gv.deadline);daysLeft=Math.ceil((dl-today)/(1000*60*60*24));}
        goals.push({domain,proc:proc.label,maker,target:gv.target,cur,rate:Math.round(cur/gv.target*100),deadline:gv.deadline,daysLeft,note:gv.note});
      });
    });
    if(!goals.length) return `<div style="font-size:10px;color:#94a3b8">目標が設定されていません</div>`;
    goals.sort((a,b)=>{
      if(a.daysLeft===null&&b.daysLeft===null)return a.rate-b.rate;
      if(a.daysLeft===null)return 1; if(b.daysLeft===null)return -1;
      return a.daysLeft-b.daysLeft;
    });
    return `<table><thead><tr><th>業務</th><th>術式</th><th>メーカー</th><th>現在</th><th>目標</th><th>達成率</th><th>期限</th><th>メモ</th></tr></thead><tbody>

// 評価サイクルリマインド（E-1）
// ═══════════════════════════════════════════════════════
function renderReminder(){
  const old=document.getElementById("reminderBar");
  if(old) old.remove();
  if(ROLE==="self") return; // パスワード入力者のみ

  const alerts=[];
  const today=new Date();

  S.staff.forEach(p=>{
    // ① 最終評価日から3ヶ月経過チェック
    const lastUpd=p.leader?._updatedAt;
    if(lastUpd){
      const d=new Date(lastUpd.replace(/\//g,"-"));
      const days=Math.floor((today-d)/(1000*60*60*24));
      if(days>=90) alerts.push({type:"eval",name:p.name,msg:`最終評価から${days}日経過（要再評価）`,color:"#ea580c"});
    }else{
      alerts.push({type:"eval",name:p.name,msg:"リーダー評価が未実施",color:"#dc2626"});
    }
    // ② 期限切れ目標
    ["cieds","abl"].forEach(domain=>{
      const g=p.admin?.[domain]||{};
      Object.entries(g).forEach(([key,gv])=>{
        if(!gv?.target||!gv.deadline)return;
        const dl=new Date(gv.deadline);
        const daysLeft=Math.ceil((dl-today)/(1000*60*60*24));
        const [maker,...pp]=key.split("_");
        const procId=pp.join("_");
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const proc=procs.find(x=>x.id===procId);
        if(!proc)return;
        const cur=calcSkillScore(p.leader,domain,procId,maker,p,false);
        if(cur>=gv.target)return; // 達成済み
        if(daysLeft<0) alerts.push({type:"goal",name:p.name,msg:`${proc.label}×${maker} 目標期限超過（${-daysLeft}日）`,color:"#dc2626"});
        else if(daysLeft<=30) alerts.push({type:"goal",name:p.name,msg:`${proc.label}×${maker} 目標期限まで${daysLeft}日`,color:"#ea580c"});
      });
    });
  });

  if(!alerts.length) return;

  const bar=document.createElement("div");
  bar.id="reminderBar";
  bar.style.cssText="background:#fffbeb;border:1px solid #fbbf24;border-radius:8px;padding:10px 14px;margin:8px 12px";
  const hdr=document.createElement("div");
  hdr.style.cssText="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;color:#92400e";
  hdr.innerHTML=`<span>対応が必要な項目 ${alerts.length}件</span><span style="margin-left:auto;font-size:11px">▼</span>`;
  const list=document.createElement("div");
  list.style.cssText="display:none;margin-top:8px;max-height:200px;overflow-y:auto";
  alerts.slice(0,30).forEach(a=>{
    const item=document.createElement("div");
    item.style.cssText=`font-size:11px;padding:4px 8px;border-left:3px solid ${a.color};margin-bottom:4px;background:#fff;border-radius:0 4px 4px 0`;
    item.innerHTML=`<b style="color:#1a1a2e">${a.name}</b>　<span style="color:${a.color}">${a.msg}</span>`;
    list.appendChild(item);
  });
  hdr.onclick=()=>{
    const open=list.style.display!=="none";
    list.style.display=open?"none":"block";
    hdr.querySelector("span:last-child").textContent=open?"▼":"▲";
  };
  bar.appendChild(hdr);bar.appendChild(list);

  const tabs=document.getElementById("tabs");
  if(tabs&&tabs.parentNode) tabs.parentNode.insertBefore(bar,tabs.nextSibling);
}

// ② Firebase SDKのロードを非同期で待機（最大5秒）
//    ロード完了したらリスナーをセット
let _initWait = 0;
const _initTimer = setInterval(()=>{
  _initWait += 100;
  if(typeof window._fbListen === "function" || _initWait >= 5000){
    clearInterval(_initTimer);
    if(typeof window._fbListen === "function"){
      // Firebaseリスナー登録（他PCからの変更を受信）
      window._fbListen(data => {
        if(!repairState(data)) return;
        localStorage.setItem(LS_KEY, JSON.stringify(data));
        const isEcho = (Date.now() - _lastSaveTime) < ECHO_GUARD_MS;
        if(!_fbReady){
          S = data;
          _fbReady = true;
          setSyncStatus("synced");
          renderAll();
        } else if(!isEcho){
          // 他のPCからの変更のみ再描画（自分の保存後5秒以内は無視）
          S = data;
          renderAll();
        }
        // エコーバック期間中はデータ更新なし（自分のSをそのまま維持）
      });
    } else {
      setSyncStatus("error");
      console.warn("Firebase未接続 - ローカルモードで動作");
    }
  }
}, 100);
</script>
