// 症例ログ（A-1 症例ごとの詳細記録）
// ═══════════════════════════════════════════════════════
const CASE_ROLES = ["メイン","外回り"];
let LAST_CASE_INPUT = null; // 前回の入力値を記憶
const CASE_DIFFICULTY = [
  {id:"easy",   label:"標準",   weight:1.0, color:"#059669", desc:"AF初回、PVC（RV）"},
  {id:"medium", label:"やや複雑", weight:1.5, color:"#ca8a04", desc:"AF redo、AT、PSVT、PVC（LV）"},
  {id:"hard",   label:"複雑",   weight:2.0, color:"#dc2626", desc:"VT、Brugada"},
];

// 術式から難易度を自動判定（ABL）
const ABL_DIFFICULTY_MAP = {
  "Af_first": "easy",
  "PVC_RV":   "easy",
  "VT":       "hard",
  "Brugada":  "hard",
  // それ以外はすべて medium（やや複雑）
};
function autoDifficulty(domain, procId){
  if(domain !== "abl") return "medium"; // CIEDsは後で定義（暫定：やや複雑）
  return ABL_DIFFICULTY_MAP[procId] || "medium";
}


// 症例ログ → 月別症例数へ反映（delta: +1 追加 / -1 削除）
function syncCaseLogToMonthly(staffObj, entry, delta){
  if(!staffObj?.leader) return;
  if(!staffObj.leader.monthlyCases) staffObj.leader.monthlyCases = {};
  if(!staffObj.leader.cases) staffObj.leader.cases = mkCases();
  const mc = staffObj.leader.monthlyCases;
  const cases = staffObj.leader.cases;

  const mo = entry.date.slice(0,7);   // YYYY-MM
  const yr = entry.date.slice(0,4);   // YYYY
  const field = entry.role === "メイン" ? "main" : "sub";
  const key = `${entry.maker}_${entry.proc}`;

  // 月別データを更新
  if(!mc[mo]) mc[mo] = mkMonthData();
  if(!mc[mo][entry.domain]) mc[mo][entry.domain] = {};
  if(!mc[mo][entry.domain][key]) mc[mo][entry.domain][key] = {main:"",sub:""};
  const cur = parseInt(mc[mo][entry.domain][key][field] || 0) || 0;
  const next = Math.max(0, cur + delta);
  mc[mo][entry.domain][key][field] = next > 0 ? String(next) : "";

  // 年度タブを自動生成
  if(!cases[yr]) cases[yr] = mkCasesYr();

  // 年度データを再集計（手動入力分 + 月別合計）
  if(!cases[yr][entry.domain]) cases[yr][entry.domain] = {};
  if(!cases[yr][entry.domain][key]) cases[yr][entry.domain][key] = {main:"",sub:"",_manual:{main:"",sub:""}};
  const yEntry = cases[yr][entry.domain][key];
  // _manual未設定の場合：現在の値から月別合計を引いた分を手動入力分として初期化
  if(!yEntry._manual){
    yEntry._manual = {main:"",sub:""};
    ["main","sub"].forEach(f=>{
      const curTotal = parseInt(yEntry[f]||0)||0;
      const moTotalNow = Object.entries(mc)
        .filter(([m])=>/^\d{4}-\d{2}$/.test(m) && m.startsWith(yr))
        .reduce((s,[,md])=>s+(parseInt(md?.[entry.domain]?.[key]?.[f]||0)||0),0);
      // 今回の追加分を除外して既存の月別合計を求める
      const beforeThis = (f===field) ? moTotalNow - delta : moTotalNow;
      const manualPart = Math.max(0, curTotal - beforeThis);
      yEntry._manual[f] = manualPart>0 ? String(manualPart) : "";
    });
  }
  ["main","sub"].forEach(f=>{
    const moTotal = Object.entries(mc)
      .filter(([m])=>/^\d{4}-\d{2}$/.test(m) && m.startsWith(yr))
      .reduce((s,[,md])=>s+(parseInt(md?.[entry.domain]?.[key]?.[f]||0)||0),0);
    const manualVal = parseInt(yEntry._manual[f]||0)||0;
    const total = manualVal + moTotal;
    yEntry[f] = total>0 ? String(total) : "";
  });
}

function buildCaseLog(container, staffObj, readonly){
  container.innerHTML="";
  if(!staffObj.caseLog) staffObj.caseLog=[];
  const logs=staffObj.caseLog;

  // 説明
  const desc=document.createElement("div");
  desc.style.cssText="font-size:11px;color:#64748b;background:#eff6ff;border-left:3px solid #1d4ed8;padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:12px";
  desc.innerHTML="症例を1件ずつ記録すると<b>症例数（月別・年度）に自動反映</b>されます。<br>過去分を記録だけしたい場合は<b>「症例数に反映」のチェックを外して</b>ください（すでに手動入力済みの分と重複しません）。";
  container.appendChild(desc);

  // 入力フォーム（リーダー以上のみ）
  if(!readonly && ROLE!=="self"){
    const form=document.createElement("div");
    form.style.cssText="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:12px";
    form.innerHTML=`<div style="font-size:12px;font-weight:700;color:#1a1a2e;margin-bottom:8px">症例を記録</div>`;

    const row=document.createElement("div");
    row.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start";

    function mkField(label,el,w){
      const d=document.createElement("div");d.style.cssText=`display:flex;flex-direction:column;gap:2px;${w?`width:${w}`:''}`;
      const lb=document.createElement("label");lb.style.cssText="font-size:10px;color:#64748b";lb.textContent=label;
      d.appendChild(lb);d.appendChild(el);return d;
    }

    const dInp=document.createElement("input");dInp.type="date";
    dInp.value=new Date().toISOString().slice(0,10);
    dInp.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px";

    const domSel=document.createElement("select");
    domSel.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px";
    domSel.innerHTML=`<option value="cieds">CIEDs</option><option value="abl">ABL</option>`;
    domSel.value="cieds";
    domSel.setAttribute("autocomplete","off");

    const procSel=document.createElement("select");
    procSel.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px;max-width:120px";

    const makerSel=document.createElement("select");
    makerSel.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px;max-width:100px";

    const roleSel=document.createElement("select");
    roleSel.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px";
    roleSel.innerHTML=CASE_ROLES.map(r=>`<option value="${r}">${r}</option>`).join("");

    const diffSel=document.createElement("select");
    diffSel.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px";
    diffSel.innerHTML=CASE_DIFFICULTY.map(d=>`<option value="${d.id}" title="${d.desc}">${d.label}</option>`).join("");
    // 難易度の説明を下に表示
    const diffHint=document.createElement("div");
    diffHint.style.cssText="font-size:9px;color:#94a3b8;line-height:1.4;margin-top:2px;white-space:normal";
    function updDiffHint(){
      const d=CASE_DIFFICULTY.find(x=>x.id===diffSel.value);
      if(!d){ diffHint.innerHTML=""; return; }
      const auto=autoDifficulty(domSel.value, procSel.value);
      const isAuto = diffSel.value===auto;
      const tag = isAuto
        ? '<span style="color:#059669;font-weight:600">自動判定</span>'
        : '<span style="color:#ea580c;font-weight:600">手動変更</span>';
      diffHint.innerHTML = `${tag}<br><span style="color:${d.color};font-weight:600">${d.label}</span>：${d.desc}`;
    }
    diffSel.addEventListener("change",updDiffHint);

    const supSel=document.createElement("select");
    supSel.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px;max-width:100px";
    supSel.innerHTML=`<option value="">指導者なし</option>`+S.staff.map(p=>`<option value="${p.name}">${p.name}</option>`).join("");

    const memoInp=document.createElement("input");memoInp.type="text";memoInp.placeholder="メモ（任意）";
    memoInp.style.cssText="font-size:11px;padding:4px 6px;border:1px solid #d0d4e0;border-radius:4px;min-width:140px";

    // 症例数へ反映するかのチェックボックス
    const syncWrap=document.createElement("label");
    syncWrap.style.cssText="display:flex;align-items:center;gap:4px;font-size:10px;color:#374151;cursor:pointer;white-space:nowrap;padding:4px 8px;background:#eff6ff;border:1px solid #93c5fd;border-radius:4px";
    const syncChk=document.createElement("input");syncChk.type="checkbox";syncChk.checked=true;
    syncChk.style.cssText="width:14px;height:14px;cursor:pointer";
    syncWrap.appendChild(syncChk);
    syncWrap.appendChild(document.createTextNode("症例数に反映"));

    function refreshProcs(){
      const dom=domSel.value;
      const procs=dom==="cieds"?CIEDS_PROCS:ABL_CASES_PROCS;
      procSel.innerHTML=procs.map(p=>`<option value="${p.id}">${p.label}</option>`).join("");
      refreshMakers();
      applyAutoDifficulty();
    }
    function refreshMakers(){
      const dom=domSel.value;
      const pid=procSel.value;
      let makers;
      if(dom==="cieds"){
        const proc=CIEDS_PROCS.find(p=>p.id===pid);
        makers=CIEDS_MAKERS.filter(m=>proc?ciedsValid(proc,m):true);
      }else{
        const proc=ABL_CASES_PROCS.find(p=>p.id===pid);
        makers=proc?proc.sys:ABL_SYSTEMS;
      }
      makerSel.innerHTML=makers.map(m=>`<option value="${m}">${m}</option>`).join("");
    }
    function applyAutoDifficulty(){
      const auto = autoDifficulty(domSel.value, procSel.value);
      diffSel.value = auto;
      updDiffHint();
    }
    domSel.addEventListener("change",()=>{ refreshProcs(); });
    procSel.addEventListener("change",()=>{ refreshMakers(); applyAutoDifficulty(); });
    refreshProcs();

    // 前回入力値を復元
    if(LAST_CASE_INPUT){
      const L=LAST_CASE_INPUT;
      if(L.domain){ domSel.value=L.domain; refreshProcs(); }
      if(L.proc){ procSel.value=L.proc; refreshMakers(); applyAutoDifficulty(); }
      if(L.maker) makerSel.value=L.maker;
      if(L.role) roleSel.value=L.role;
      if(L.supervisor!==undefined) supSel.value=L.supervisor;
      if(L.synced!==undefined) syncChk.checked=L.synced;
    }

    const addBtn=document.createElement("button");
    addBtn.className="btn btn-primary";addBtn.style.cssText="font-size:11px;padding:5px 14px";
    addBtn.textContent="＋ 追加";
    addBtn.onclick=()=>{
      const entry={
        date:dInp.value, domain:domSel.value, proc:procSel.value,
        maker:makerSel.value, role:roleSel.value, difficulty:diffSel.value,
        supervisor:supSel.value, memo:memoInp.value,
        recordedAt:new Date().toLocaleString('ja-JP'), recordedBy:ROLE
      };
      entry.synced = syncChk.checked;  // 症例数に反映したかを記録
      // 前回入力値として記憶（次回の入力補助用）
      LAST_CASE_INPUT = {
        domain: entry.domain, proc: entry.proc, maker: entry.maker,
        role: entry.role, supervisor: entry.supervisor, synced: entry.synced
      };
      logs.push(entry);
      // 月別症例数に反映（チェックONの場合のみ）
      if(syncChk.checked) syncCaseLogToMonthly(staffObj, entry, +1);
      memoInp.value="";
      saveDataNow();
      buildCaseLog(container,staffObj,readonly);
    };

    row.appendChild(mkField("日付",dInp));
    row.appendChild(mkField("業務",domSel));
    row.appendChild(mkField("術式",procSel));
    row.appendChild(mkField("メーカー",makerSel));
    row.appendChild(mkField("役割",roleSel));
    const diffWrap=document.createElement("div");
    diffWrap.style.cssText="display:flex;flex-direction:column;gap:2px;min-width:150px";
    diffWrap.appendChild(diffSel);
    diffWrap.appendChild(diffHint);
    row.appendChild(mkField("難易度",diffWrap));
    row.appendChild(mkField("指導者",supSel));
    row.appendChild(mkField("メモ",memoInp));
    row.appendChild(syncWrap);

    // 直近の入力から複製ボタン
    if(logs.length){
      const dupBtn=document.createElement("button");
      dupBtn.textContent="直近と同じ";
      dupBtn.title="最後に記録した症例と同じ内容を入力欄にセットします";
      dupBtn.style.cssText="font-size:11px;padding:5px 12px;border:1px solid #93c5fd;border-radius:6px;background:#eff6ff;color:#1d4ed8;cursor:pointer;font-weight:600;white-space:nowrap";
      dupBtn.onclick=()=>{
        const last=logs[logs.length-1];
        domSel.value=last.domain; refreshProcs();
        procSel.value=last.proc; refreshMakers(); applyAutoDifficulty();
        makerSel.value=last.maker;
        roleSel.value=last.role;
        diffSel.value=last.difficulty; updDiffHint();
        supSel.value=last.supervisor||"";
        syncChk.checked=last.synced!==false;
      };
      row.appendChild(dupBtn);
    }

    row.appendChild(addBtn);
    form.appendChild(row);
    container.appendChild(form);
  }

  // 統計サマリ
  if(logs.length){
    // 経験値はメインのみ集計
    const totalWeight=logs.reduce((s,l)=>{
      if(l.role!=="メイン") return s;
      const d=CASE_DIFFICULTY.find(x=>x.id===l.difficulty);
      return s+(d?d.weight:1);
    },0);
    const roleCounts={};
    logs.forEach(l=>{roleCounts[l.role]=(roleCounts[l.role]||0)+1;});
    const stat=document.createElement("div");
    stat.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px";
    stat.innerHTML=`
      <div style="background:#eff6ff;border-radius:6px;padding:6px 12px;font-size:11px">
        <div style="color:#64748b;font-size:10px">総症例数</div>
        <div style="font-size:16px;font-weight:700;color:#1d4ed8">${logs.length}</div>
      </div>
      <div style="background:#f0fdf4;border-radius:6px;padding:6px 12px;font-size:11px">
        <div style="color:#64748b;font-size:10px">経験値（メインのみ・難易度加重）</div>
        <div style="font-size:16px;font-weight:700;color:#059669">${totalWeight.toFixed(1)}</div>
      </div>
      ${Object.entries(roleCounts).map(([r,c])=>`
      <div style="background:#f8fafc;border-radius:6px;padding:6px 12px;font-size:11px">
        <div style="color:#64748b;font-size:10px">${r}</div>
        <div style="font-size:16px;font-weight:700;color:#374151">${c}</div>
      </div>`).join("")}`;
    container.appendChild(stat);
  }

  // 一覧
  if(!logs.length){
    const empty=document.createElement("div");
    empty.style.cssText="padding:20px;text-align:center;color:#94a3b8;font-size:13px";
    empty.textContent="症例記録がありません";
    container.appendChild(empty);
    return;
  }
  const sorted=[...logs].sort((a,b)=>b.date.localeCompare(a.date));
  const tbl=document.createElement("table");tbl.className="tbl";
  tbl.innerHTML=`<thead><tr><th>日付</th><th>業務</th><th>術式</th><th>メーカー</th><th>役割</th><th>難易度</th><th>反映</th><th>指導者</th><th>メモ</th>${(!readonly&&ROLE!=="self")?"<th></th>":""}</tr></thead>`;
  const tb=tbl.createTBody();
  sorted.forEach(l=>{
    const procs=l.domain==="cieds"?CIEDS_PROCS:ABL_CASES_PROCS;
    const proc=procs.find(p=>p.id===l.proc);
    const diff=CASE_DIFFICULTY.find(d=>d.id===l.difficulty)||CASE_DIFFICULTY[0];
    const tr=tb.insertRow();
    tr.innerHTML=`<td style="font-size:11px;white-space:nowrap">${l.date}</td>
      <td style="font-size:11px">${l.domain==="cieds"?"CIEDs":"ABL"}</td>
      <td style="font-size:11px">${proc?proc.label:l.proc}</td>
      <td style="font-size:11px">${l.maker}</td>
      <td style="font-size:10px"><span style="background:#f1f5f9;padding:1px 6px;border-radius:4px">${l.role}</span></td>
      <td style="font-size:10px;text-align:center"><span style="background:${diff.color};color:#fff;padding:1px 6px;border-radius:4px">${diff.label}</span></td>
      <td style="font-size:10px;text-align:center">${l.synced!==false?'<span style="color:#059669" title="症例数に反映済み">済</span>':'<span style="color:#94a3b8" title="記録のみ（症例数に未反映）">−</span>'}</td>
      <td style="font-size:11px">${l.supervisor||"—"}</td>
      <td style="font-size:10px;color:#64748b">${l.memo||"—"}</td>`;
    if(!readonly&&ROLE!=="self"){
      const td=tr.insertCell();
      const del=document.createElement("button");
      del.textContent="×";
      del.style.cssText="font-size:11px;padding:1px 6px;border:1px solid #fca5a5;border-radius:3px;background:#fef2f2;color:#dc2626;cursor:pointer";
      del.onclick=()=>{
        const msg = l.synced!==false
          ? "この症例記録を削除しますか？\n（症例数からも-1されます）"
          : "この症例記録を削除しますか？\n（症例数には反映されていません）";
        if(!confirm(msg))return;
        const idx=logs.indexOf(l);
        if(idx>=0){
          if(l.synced!==false) syncCaseLogToMonthly(staffObj, l, -1);
          logs.splice(idx,1);
        }
        saveDataNow();
        buildCaseLog(container,staffObj,readonly);
      };
      td.appendChild(del);
    }
  });
  container.appendChild(tbl);
}

// ═══════════════════════════════════════════════════════
// 変更ログ（E-4 監査証跡）
// ═══════════════════════════════════════════════════════
function buildAuditLog(container){
  container.innerHTML="";
  const logs=[];
  S.staff.forEach(p=>{
    ["self","leader"].forEach(role=>{
      ["cieds","abl"].forEach(domain=>{
        const hist=p.scoreHistory?.[role]?.[domain]||{};
        Object.entries(hist).forEach(([key,arr])=>{
          if(!Array.isArray(arr))return;
          const [maker,...pp]=key.split("_");
          const procId=pp.join("_");
          const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
          const proc=procs.find(x=>x.id===procId);
          if(!proc)return;
          arr.forEach((h,i)=>{
            const prev=i>0?arr[i-1].score:0;
            logs.push({
              date:h.date, at:h.at||h.date, name:p.name,
              role:role==="self"?"自己":"リーダー",
              domain:domain==="cieds"?"CIEDs":"ABL",
              proc:proc.label, maker, prev, score:h.score,
              by:h.by||"—"
            });
          });
        });
      });
    });
  });
  logs.sort((a,b)=>(b.at||b.date).localeCompare(a.at||a.date));

  if(!logs.length){
    container.innerHTML=`<div style="padding:20px;text-align:center;color:#94a3b8;font-size:13px">変更ログがありません</div>`;
    return;
  }

  const note=document.createElement("div");
  note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
  note.textContent=`スコア変更の全履歴（新しい順・${logs.length}件）。評価の透明性を担保します。`;
  container.appendChild(note);

  const tbl=document.createElement("table");tbl.className="tbl";
  tbl.innerHTML=`<thead><tr><th>日時</th><th>スタッフ</th><th>評価種別</th><th>業務</th><th>術式</th><th>メーカー</th><th>変更</th><th>操作者</th></tr></thead>`;
  const tb=tbl.createTBody();
  logs.slice(0,200).forEach(l=>{
    const up=l.score>l.prev;
    const tr=tb.insertRow();
    tr.innerHTML=`<td style="font-size:10px;white-space:nowrap">${l.at}</td>
      <td style="font-size:11px;font-weight:600">${l.name}</td>
      <td style="font-size:10px"><span style="background:${l.role==="自己"?'#dbeafe':'#dcfce7'};padding:1px 6px;border-radius:4px">${l.role}</span></td>
      <td style="font-size:11px">${l.domain}</td>
      <td style="font-size:11px">${l.proc}</td>
      <td style="font-size:11px">${l.maker}</td>
      <td style="font-size:11px;text-align:center;white-space:nowrap">
        <span class="sc sc${l.prev}">${l.prev}</span>
        <span style="color:${up?'#059669':'#dc2626'};font-weight:700">→</span>
        <span class="sc sc${l.score}">${l.score}</span>
      </td>
      <td style="font-size:10px;color:#64748b">${l.by}</td>`;
  });
  container.appendChild(tbl);
  if(logs.length>200){
    const more=document.createElement("div");
    more.style.cssText="font-size:11px;color:#94a3b8;padding:8px;text-align:center";
    more.textContent=`※ 最新200件を表示（全${logs.length}件）`;
    container.appendChild(more);
  }
}

// ═══════════════════════════════════════════════════════
// チーム分析（ヒートマップ・ギャップ・リスク・目標達成率）
// ═══════════════════════════════════════════════════════
function buildTeamAnalysis(container){
  container.innerHTML="";
  if(!(ROLE==="leader"||ROLE==="admin"||ROLE==="creator")){
    container.innerHTML=`<div style="color:#94a3b8;font-size:13px;padding:20px;text-align:center">リーダー以上のモードで閲覧できます</div>`;
    return;
  }

  const tabBar=document.createElement("div");tabBar.className="domain-tabs";
  const body=document.createElement("div");
  const views=[
    ["heatmap","スキルマップ"],
    ["gap","評価ギャップ"],
    ["risk","属人化リスク"],
    ["goal","目標達成率"],
    ["growth","成長速度"],
    ["corr","症例数×スコア"],
    ["audit","変更ログ"],
  ];
  let curView="heatmap";

  function heatColor(score){
    if(score===0) return "#f1f5f9";
    if(score<=2) return "#fecaca";
    if(score<=3) return "#fed7aa";
    if(score<=4) return "#fef08a";
    if(score<=5) return "#bbf7d0";
    if(score<=6) return "#86efac";
    return "#4ade80";
  }

  // スタッフ別カードを作るヘルパー
  function makeStaffCard(name, contentEl, badge){
    const card=document.createElement("div");card.className="card";card.style.marginBottom="10px";
    const hdr=document.createElement("div");
    hdr.style.cssText="padding:10px 14px;background:#f1f5f9;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0;cursor:pointer";
    hdr.innerHTML=`<span style="font-weight:700;color:#1a1a2e;font-size:13px">${name}</span>${badge||""}
      <span style="margin-left:auto;font-size:11px;color:#94a3b8">▼</span>`;
    const bodyEl=document.createElement("div");bodyEl.style.display="none";bodyEl.style.padding="8px";
    bodyEl.appendChild(contentEl);
    hdr.onclick=()=>{
      const open=bodyEl.style.display!=="none";
      bodyEl.style.display=open?"none":"block";
      hdr.querySelector("span:last-child").textContent=open?"▼":"▲";
    };
    card.appendChild(hdr);card.appendChild(bodyEl);
    return card;
  }

  function drawView(){
    body.innerHTML="";

    // ── ① スキルマップ（全体ヒートマップ）──────────
    if(curView==="heatmap"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="縦：スタッフ、横：術式×メーカー。色が濃いほど習熟度が高い（リーダー評価ベース）";
      body.appendChild(note);

      ["cieds","abl"].forEach(domain=>{
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
        const sec=document.createElement("div");sec.style.marginBottom="24px";
        const h=document.createElement("div");
        h.style.cssText="font-weight:700;font-size:13px;color:#1a1a2e;margin-bottom:8px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:4px solid #0f3460";
        h.textContent=domain==="cieds"?"CIEDs（デバイス）":"ABL（アブレーション）";
        sec.appendChild(h);

        const wrap=document.createElement("div");wrap.style.overflowX="auto";
        const tbl=document.createElement("table");tbl.className="tbl";tbl.style.fontSize="10px";
        const thead=tbl.createTHead();const hr=thead.insertRow();
        const th0=document.createElement("th");th0.textContent="スタッフ";th0.style.cssText="position:sticky;left:0;background:#1a1a2e;z-index:2;min-width:70px";
        hr.appendChild(th0);
        const cols=[];
        procs.forEach(proc=>{
          makers.forEach(m=>{
            if(domain==="cieds"&&!ciedsValid(proc,m))return;
            if(domain==="abl"&&!proc.sys.includes(m))return;
            cols.push({proc,maker:m});
            const th=document.createElement("th");
            th.innerHTML=`<div style="writing-mode:vertical-rl;height:70px;font-size:9px;padding:2px">${proc.label}<br><span style="opacity:0.7">${m}</span></div>`;
            th.style.cssText="padding:2px;min-width:24px";
            hr.appendChild(th);
          });
        });
        const tbody=tbl.createTBody();
        S.staff.forEach(p=>{
          const tr=tbody.insertRow();
          const td0=tr.insertCell();
          td0.textContent=p.name;
          td0.style.cssText="position:sticky;left:0;background:#f8fafc;font-weight:600;font-size:10px;white-space:nowrap;z-index:1;padding:4px 6px;border-right:2px solid #e2e8f0";
          cols.forEach(({proc,maker})=>{
            const score=calcSkillScore(p.leader,domain,proc.id,maker,p,false);
            const td=tr.insertCell();
            td.textContent=score===0?"":score;
            td.style.cssText=`background:${heatColor(score)};text-align:center;font-weight:700;font-size:10px;padding:4px 2px;color:${score>=5?'#166534':score>=3?'#92400e':'#7f1d1d'}`;
            td.title=`${p.name} / ${proc.label} × ${maker}: スコア${score}`;
          });
        });
        wrap.appendChild(tbl);sec.appendChild(wrap);body.appendChild(sec);
      });
    }

    // ── ② 評価ギャップ（スタッフ別）──────────────
    else if(curView==="gap"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="自己評価とリーダー評価の差が2以上の項目。スタッフ名をクリックで展開します。";
      body.appendChild(note);

      S.staff.forEach(p=>{
        const gaps=[];
        ["cieds","abl"].forEach(domain=>{
          const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
          const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
          procs.forEach(proc=>{
            makers.forEach(m=>{
              if(domain==="cieds"&&!ciedsValid(proc,m))return;
              if(domain==="abl"&&!proc.sys.includes(m))return;
              const s=calcSkillScore(p.self,domain,proc.id,m,p,true);
              const l=calcSkillScore(p.leader,domain,proc.id,m,p,false);
              const diff=s-l;
              if(Math.abs(diff)>=2) gaps.push({domain,proc:proc.label,maker:m,self:s,leader:l,diff});
            });
          });
        });
        gaps.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));

        const content=document.createElement("div");
        if(!gaps.length){
          content.innerHTML=`<div style="padding:12px;color:#94a3b8;font-size:12px">大きな評価ギャップなし</div>`;
        }else{
          const tbl=document.createElement("table");tbl.className="tbl";
          tbl.innerHTML=`<thead><tr><th>業務</th><th>術式</th><th>メーカー</th><th>自己</th><th>L</th><th>差</th><th>解釈</th></tr></thead>`;
          const tb=tbl.createTBody();
          gaps.forEach(g=>{
            const isOver=g.diff>0;
            const tr=tb.insertRow();
            tr.innerHTML=`<td style="font-size:11px">${g.domain==="cieds"?"CIEDs":"ABL"}</td>
              <td style="font-size:11px">${g.proc}</td>
              <td style="font-size:11px">${g.maker}</td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.self}">${g.self}</span></td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.leader}">${g.leader}</span></td>
              <td style="font-size:12px;text-align:center;font-weight:700;color:${isOver?'#dc2626':'#1d4ed8'}">${isOver?'+':''}${g.diff}</td>
              <td style="font-size:10px;color:${isOver?'#dc2626':'#1d4ed8'}">${isOver?'自己評価が高い':'自信不足'}</td>`;
          });
          content.appendChild(tbl);
        }
        const badge=gaps.length?`<span style="font-size:11px;background:#fef2f2;color:#dc2626;padding:1px 8px;border-radius:4px">${gaps.length}件</span>`:`<span style="font-size:11px;color:#059669">なし</span>`;
        body.appendChild(makeStaffCard(p.name,content,badge));
      });
    }

    // ── ③ 属人化リスク ────────────────────────
    else if(curView==="risk"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="スコア5以上（単独可）のスタッフが少ない領域を検出。危険度順に表示します。";
      body.appendChild(note);

      const risks=[];
      ["cieds","abl"].forEach(domain=>{
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
        procs.forEach(proc=>{
          makers.forEach(m=>{
            if(domain==="cieds"&&!ciedsValid(proc,m))return;
            if(domain==="abl"&&!proc.sys.includes(m))return;
            const capable=S.staff.filter(p=>calcSkillScore(p.leader,domain,proc.id,m,p,false)>=5);
            risks.push({domain,proc:proc.label,maker:m,count:capable.length,names:capable.map(p=>p.name)});
          });
        });
      });
      risks.sort((a,b)=>a.count-b.count);

      // 危険度別にグループ化
      const groups={"危険（0名）":[],"高（1名）":[],"中（2名）":[],"低（3名以上）":[]};
      risks.forEach(r=>{
        const key=r.count===0?"危険（0名）":r.count===1?"高（1名）":r.count===2?"中（2名）":"低（3名以上）";
        groups[key].push(r);
      });

      Object.entries(groups).forEach(([label,items])=>{
        if(!items.length)return;
        const color=label.startsWith("危険")?"#dc2626":label.startsWith("高")?"#ea580c":label.startsWith("中")?"#ca8a04":"#059669";
        const bg=label.startsWith("危険")?"#fef2f2":label.startsWith("高")?"#fff7ed":label.startsWith("中")?"#fefce8":"#f0fdf4";
        const sec=document.createElement("div");sec.style.marginBottom="16px";
        const h=document.createElement("div");
        h.style.cssText=`font-weight:700;font-size:12px;color:${color};padding:6px 10px;background:${bg};border-radius:6px;border-left:4px solid ${color};margin-bottom:6px`;
        h.textContent=`${label}　${items.length}項目`;
        sec.appendChild(h);
        const tbl=document.createElement("table");tbl.className="tbl";
        tbl.innerHTML=`<thead><tr><th>業務</th><th>術式</th><th>メーカー</th><th>対応可能者</th></tr></thead>`;
        const tb=tbl.createTBody();
        items.forEach(r=>{
          const tr=tb.insertRow();
          tr.innerHTML=`<td style="font-size:11px">${r.domain==="cieds"?"CIEDs":"ABL"}</td>
            <td style="font-size:11px">${r.proc}</td>
            <td style="font-size:11px">${r.maker}</td>
            <td style="font-size:10px;color:#374151">${r.names.join("、")||"—"}</td>`;
        });
        sec.appendChild(tbl);
        body.appendChild(sec);
      });
    }

    // ── ④ 目標達成率（スタッフ別）─────────────
    else if(curView==="goal"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="上層部の目標に対する達成状況。スタッフ名をクリックで展開します。";
      body.appendChild(note);

      const today=new Date();
      S.staff.forEach(p=>{
        const goals=[];
        ["cieds","abl"].forEach(domain=>{
          const g=p.admin?.[domain]||{};
          Object.entries(g).forEach(([key,gv])=>{
            if(!gv?.target||gv.target===0)return;
            const [maker,...procParts]=key.split("_");
            const procId=procParts.join("_");
            const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
            const proc=procs.find(pp=>pp.id===procId);
            if(!proc)return;
            const current=calcSkillScore(p.leader,domain,procId,maker,p,false);
            const rate=Math.round(current/gv.target*100);
            let daysLeft=null;
            if(gv.deadline){
              const dl=new Date(gv.deadline);
              daysLeft=Math.ceil((dl-today)/(1000*60*60*24));
            }
            goals.push({domain,proc:proc.label,maker,target:gv.target,current,rate,deadline:gv.deadline,daysLeft});
          });
        });
        goals.sort((a,b)=>{
          if(a.daysLeft===null&&b.daysLeft===null)return a.rate-b.rate;
          if(a.daysLeft===null)return 1;
          if(b.daysLeft===null)return -1;
          return a.daysLeft-b.daysLeft;
        });

        const content=document.createElement("div");
        if(!goals.length){
          content.innerHTML=`<div style="padding:12px;color:#94a3b8;font-size:12px">目標未設定</div>`;
        }else{
          const tbl=document.createElement("table");tbl.className="tbl";
          tbl.innerHTML=`<thead><tr><th>業務</th><th>術式</th><th>メーカー</th><th>現在</th><th>目標</th><th>達成率</th><th>期限</th><th>状態</th></tr></thead>`;
          const tb=tbl.createTBody();
          goals.forEach(g=>{
            const achieved=g.current>=g.target;
            let status="",statusColor="#64748b",rowBg="";
            if(achieved){ status="達成"; statusColor="#059669"; rowBg="#f0fdf4"; }
            else if(g.daysLeft===null){ status="期限未設定"; statusColor="#94a3b8"; }
            else if(g.daysLeft<0){ status=`超過${-g.daysLeft}日`; statusColor="#dc2626"; rowBg="#fef2f2"; }
            else if(g.daysLeft<=30){ status=`残${g.daysLeft}日`; statusColor="#ea580c"; rowBg="#fff7ed"; }
            else { status=`残${g.daysLeft}日`; statusColor="#0891b2"; }
            const tr=tb.insertRow();
            if(rowBg) tr.style.background=rowBg;
            tr.innerHTML=`<td style="font-size:11px">${g.domain==="cieds"?"CIEDs":"ABL"}</td>
              <td style="font-size:11px">${g.proc}</td>
              <td style="font-size:11px">${g.maker}</td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.current}">${g.current}</span></td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.target}">${g.target}</span></td>
              <td style="font-size:11px;text-align:center">
                <div style="background:#e2e8f0;border-radius:8px;height:14px;position:relative;overflow:hidden;min-width:56px">
                  <div style="background:${achieved?'#059669':g.rate>=70?'#0891b2':g.rate>=40?'#ca8a04':'#dc2626'};height:100%;width:${Math.min(g.rate,100)}%"></div>
                  <span style="position:absolute;top:0;left:0;right:0;font-size:9px;line-height:14px;font-weight:700;color:#1a1a2e">${g.rate}%</span>
                </div>
              </td>
              <td style="font-size:10px;white-space:nowrap">${g.deadline||"—"}</td>
              <td style="font-size:10px;font-weight:600;color:${statusColor};white-space:nowrap">${status}</td>`;
          });
          content.appendChild(tbl);
        }
        const achievedCnt=goals.filter(g=>g.current>=g.target).length;
        const badge=goals.length
          ? `<span style="font-size:11px;background:#eff6ff;color:#1d4ed8;padding:1px 8px;border-radius:4px">${achievedCnt}/${goals.length} 達成</span>`
          : `<span style="font-size:11px;color:#94a3b8">目標なし</span>`;
        body.appendChild(makeStaffCard(p.name,content,badge));
      });
    }

    // ── ⑤ 成長速度（スタッフ別）────────────────
    else if(curView==="growth"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="スコア履歴から成長のペースを分析。期間あたりのスコア上昇量を表示します。";
      body.appendChild(note);

      S.staff.forEach(p=>{
        const growths=[];
        ["cieds","abl"].forEach(domain=>{
          const hist=p.scoreHistory?.leader?.[domain]||{};
          Object.entries(hist).forEach(([key,arr])=>{
            if(!Array.isArray(arr)||arr.length<2)return;
            const [maker,...procParts]=key.split("_");
            const procId=procParts.join("_");
            const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
            const proc=procs.find(pp=>pp.id===procId);
            if(!proc)return;
            const first=arr[0],last=arr[arr.length-1];
            const d1=new Date(first.date),d2=new Date(last.date);
            const days=Math.max(1,Math.ceil((d2-d1)/(1000*60*60*24)));
            const delta=last.score-first.score;
            const perMonth=(delta/days*30).toFixed(2);
            growths.push({domain,proc:proc.label,maker,first:first.score,last:last.score,delta,days,perMonth});
          });
        });
        growths.sort((a,b)=>b.delta-a.delta);

        const content=document.createElement("div");
        if(!growths.length){
          content.innerHTML=`<div style="padding:12px;color:#94a3b8;font-size:12px">履歴データ不足（2回以上の変更が必要）</div>`;
        }else{
          const tbl=document.createElement("table");tbl.className="tbl";
          tbl.innerHTML=`<thead><tr><th>業務</th><th>術式</th><th>メーカー</th><th>初回</th><th>現在</th><th>伸び</th><th>期間</th><th>月あたり</th></tr></thead>`;
          const tb=tbl.createTBody();
          growths.forEach(g=>{
            const tr=tb.insertRow();
            const col=g.delta>0?"#059669":g.delta<0?"#dc2626":"#64748b";
            tr.innerHTML=`<td style="font-size:11px">${g.domain==="cieds"?"CIEDs":"ABL"}</td>
              <td style="font-size:11px">${g.proc}</td>
              <td style="font-size:11px">${g.maker}</td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.first}">${g.first}</span></td>
              <td style="font-size:11px;text-align:center"><span class="sc sc${g.last}">${g.last}</span></td>
              <td style="font-size:12px;text-align:center;font-weight:700;color:${col}">${g.delta>0?'+':''}${g.delta}</td>
              <td style="font-size:10px;text-align:center">${g.days}日</td>
              <td style="font-size:11px;text-align:center;font-weight:600;color:${col}">${g.perMonth}</td>`;
          });
          content.appendChild(tbl);
        }
        const totalDelta=growths.reduce((s,g)=>s+g.delta,0);
        const badge=growths.length
          ? `<span style="font-size:11px;background:${totalDelta>0?'#f0fdf4':'#f1f5f9'};color:${totalDelta>0?'#059669':'#64748b'};padding:1px 8px;border-radius:4px">合計 ${totalDelta>0?'+':''}${totalDelta}</span>`
          : `<span style="font-size:11px;color:#94a3b8">データなし</span>`;
        body.appendChild(makeStaffCard(p.name,content,badge));
      });
    }

    // ── ⑥ 症例数×スコア相関 ─────────────────
    else if(curView==="corr"){
      const note=document.createElement("div");
      note.style.cssText="font-size:11px;color:#64748b;margin-bottom:12px";
      note.textContent="症例数とスコアの関係を散布図で可視化。「何件でスコアが上がるか」の目安になります。";
      body.appendChild(note);

      ["cieds","abl"].forEach(domain=>{
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;
        const pts=[];
        S.staff.forEach(p=>{
          procs.forEach(proc=>{
            makers.forEach(m=>{
              if(domain==="cieds"&&!ciedsValid(proc,m))return;
              if(domain==="abl"&&!proc.sys.includes(m))return;
              const cases=getLatestYearCases(p.leader?.cases,domain,proc.id,m,p.leader?.monthlyCases);
              const score=calcSkillScore(p.leader,domain,proc.id,m,p,false);
              if(cases>0||score>0) pts.push({cases,score,name:p.name,label:`${proc.label}×${m}`});
            });
          });
        });

        const sec=document.createElement("div");sec.style.marginBottom="24px";
        const h=document.createElement("div");
        h.style.cssText="font-weight:700;font-size:13px;color:#1a1a2e;margin-bottom:8px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:4px solid #0f3460";
        h.textContent=domain==="cieds"?"CIEDs（デバイス）":"ABL（アブレーション）";
        sec.appendChild(h);

        if(!pts.length){
          const nd=document.createElement("div");
          nd.style.cssText="padding:12px;color:#94a3b8;font-size:12px";
          nd.textContent="データなし";
          sec.appendChild(nd);
          body.appendChild(sec);return;
        }

        // 散布図SVG
        const W=560,H=280,padL=44,padB=44,padT=24,padR=16;
        const cw=W-padL-padR,ch=H-padT-padB;
        const maxCases=Math.max(...pts.map(p=>p.cases),20);
        let dots="";
        pts.forEach(p=>{
          const x=padL+(p.cases/maxCases)*cw;
          const y=padT+ch*(1-p.score/7);
          const col=p.score>=5?"#059669":p.score>=3?"#ca8a04":"#dc2626";
          dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}" fill-opacity="0.6" stroke="${col}" stroke-width="1"><title>${p.name} ${p.label}: ${p.cases}件 → スコア${p.score}</title></circle>`;
        });
        // 10件ライン（キャップ基準）
        const capX=padL+(10/maxCases)*cw;
        const capLine=`<line x1="${capX.toFixed(1)}" y1="${padT}" x2="${capX.toFixed(1)}" y2="${H-padB}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="${capX.toFixed(1)}" y="${padT-4}" text-anchor="middle" font-size="9" fill="#dc2626">10件（キャップ）</text>`;
        // グリッド
        const yGrid=[0,2,4,6,7].map(v=>{const y=padT+ch*(1-v/7);return`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e2e8f0"/><text x="${padL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${v}</text>`;}).join("");
        const xTicks=[0,.25,.5,.75,1].map(r=>{const x=padL+cw*r;const v=Math.round(maxCases*r);return`<text x="${x.toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="#94a3b8">${v}</text>`;}).join("");

        const svgWrap=document.createElement("div");svgWrap.style.overflowX="auto";
        svgWrap.innerHTML=`<svg width="${W}" height="${H}" style="font-family:sans-serif;display:block">
<text x="${W/2}" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">症例数（横）× スコア（縦）</text>
<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
${yGrid}${xTicks}${capLine}${dots}
<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="#64748b">直近1年のメイン件数</text></svg>`;
        sec.appendChild(svgWrap);

        // 統計サマリ
        const withCases=pts.filter(p=>p.cases>=10);
        const avgScore=withCases.length?(withCases.reduce((s,p)=>s+p.score,0)/withCases.length).toFixed(1):"—";
        const under=pts.filter(p=>p.cases<10);
        const avgUnder=under.length?(under.reduce((s,p)=>s+p.score,0)/under.length).toFixed(1):"—";
        const stat=document.createElement("div");
        stat.style.cssText="font-size:11px;color:#374151;padding:8px 12px;background:#f8fafc;border-radius:6px;margin-top:8px";
        stat.innerHTML=`10件以上の平均スコア：<b>${avgScore}</b>　／　10件未満の平均スコア：<b>${avgUnder}</b>　（データ数 ${pts.length}）`;
        sec.appendChild(stat);
        body.appendChild(sec);
      });
    }

    // ── ⑦ 変更ログ ──────────────────────────
    else if(curView==="audit"){
      buildAuditLog(body);
    }
  }

  views.forEach(([id,label])=>{
    const btn=document.createElement("button");
    btn.className="domain-tab"+(id===curView?" active":"");
    btn.textContent=label;btn.style.fontSize="12px";
    btn.onclick=()=>{curView=id;tabBar.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");drawView();};
    tabBar.appendChild(btn);
  });

  drawView();
  container.appendChild(tabBar);
  container.appendChild(body);
}

function buildAllStaffCompare(container){
  container.innerHTML="";
  if(!(ROLE==="leader"||ROLE==="admin"||ROLE==="creator")){
    const msg=document.createElement("div");
    msg.style.cssText="color:#94a3b8;font-size:13px;padding:20px;text-align:center";
    msg.textContent="このビューはリーダー以上のモードで閲覧できます";
    container.appendChild(msg);return;
  }

  const note=document.createElement("div");
  note.style.cssText="font-size:11px;color:#94a3b8;margin-bottom:12px";
  note.textContent="全スタッフの自己評価（S）・リーダー評価（L）・上層部目標（T）・ギャップ（T-L）を一覧比較します。";
  container.appendChild(note);

  const domTabs=document.createElement("div");domTabs.className="domain-tabs";
  const wrap=document.createElement("div");
  let curD="cieds";

  function draw(domain){
    wrap.innerHTML="";
    const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
    const makers=domain==="cieds"?CIEDS_MAKERS:ABL_SYSTEMS;

    makers.forEach(m=>{
      const validProcs=procs.filter(p=>domain==="abl"?p.sys.includes(m):true);
      if(!validProcs.length)return;

      const sec=document.createElement("div");sec.style.marginBottom="24px";
      const h=document.createElement("div");
      h.style.cssText="font-weight:700;font-size:13px;color:#1a1a2e;margin-bottom:8px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:4px solid #0f3460";
      h.textContent=`${domain==="cieds"?"CIEDs":"ABL"} — ${m}`;
      sec.appendChild(h);

      const tblWrap=document.createElement("div");tblWrap.style.overflowX="auto";
      const tbl=document.createElement("table");tbl.className="tbl";
      tbl.style.borderCollapse="separate";tbl.style.borderSpacing="0";

      // ヘッダー：スタッフ名行
      const thead=tbl.createTHead();
      const hr1=thead.insertRow();
      // 空セル×2（スタッフ名・区分）
      [["スタッフ","60px"],["区分","44px"]].forEach(([t,w])=>{
        const th=document.createElement("th");th.textContent=t;th.style.minWidth=w;
        th.style.position="sticky";th.style.left=t==="スタッフ"?"0":"60px";th.style.zIndex="3";
        hr1.appendChild(th);
      });
      validProcs.forEach(proc=>{
        const th=document.createElement("th");
        th.innerHTML=`${proc.label}`;
        th.style.minWidth="64px";hr1.appendChild(th);
      });

      const tbody=tbl.createTBody();
      const ROW_DEFS=[
        {label:"自己(S)", fn:(p,proc)=>calcSkillScore(p.self,domain,proc.id,m,p,true),  col:"#3b82f6", bg:"#eff6ff"},
        {label:"リーダー(L)",fn:(p,proc)=>calcSkillScore(p.leader,domain,proc.id,m,p,false),col:"#059669",bg:"#f0fdf4"},
        {label:"目標(T)",  fn:(p,proc)=>p.admin?.[domain]?.[`${m}_${proc.id}`]?.target||0, col:"#7c3aed",bg:"#faf5ff"},
        {label:"ギャップ", fn:null, col:"#e11d48", bg:"#fff1f2"},
      ];

      S.staff.forEach((p,pi)=>{
        ROW_DEFS.forEach(({label,fn,col,bg},ri)=>{
          const tr=tbody.insertRow();
          // スタッフ名セル（最初の行のみ、rowSpan=4）
          if(ri===0){
            const tdName=tr.insertCell();
            tdName.rowSpan=4;
            tdName.style.cssText=`font-size:11px;font-weight:700;white-space:nowrap;background:#e8edf8;vertical-align:middle;text-align:center;position:sticky;left:0;z-index:2;border-right:2px solid #d0d8f0;padding:4px 6px`;
            tdName.innerHTML=`${p.name}${p.role?`<div style="font-size:9px;color:#0f3460;font-weight:400">${p.role}</div>`:""}`;
          }
          // 区分ラベルセル
          const tdLbl=tr.insertCell();
          tdLbl.style.cssText=`font-size:9px;color:${col};font-weight:700;background:${bg};text-align:center;white-space:nowrap;position:sticky;left:60px;z-index:1;border-right:1px solid #e2e8f0;padding:3px 5px`;
          tdLbl.textContent=label;
          // 術式ごとのスコアセル
          validProcs.forEach(proc=>{
            const td=tr.insertCell();
            td.style.cssText=`text-align:center;padding:3px 4px;background:${bg}`;
            if(label==="ギャップ"){
              const lS=calcSkillScore(p.leader,domain,proc.id,m,p,false);
              const tS=p.admin?.[domain]?.[`${m}_${proc.id}`]?.target||0;
              if(!tS){td.innerHTML=`<span style="color:#d0d4e0;font-size:11px">−</span>`;}
              else{
                const gap=tS-lS;
                td.innerHTML=`<span style="font-size:12px;font-weight:700;color:${gap>0?"#ef4444":gap<0?"#22c55e":"#94a3b8"}">${gap>0?"+"+gap:gap===0?"−":gap}</span>`;
              }
            }else{
              const v=fn(p,proc);
              td.innerHTML=`<span class="sc ${scCls(v)}" style="width:26px;height:22px;font-size:11px">${v||"−"}</span>`;
            }
          });
        });
        // スタッフ間の区切り
        if(pi<S.staff.length-1){
          const trSep=tbody.insertRow();
          const tdSep=trSep.insertCell();
          tdSep.colSpan=validProcs.length+2;
          tdSep.style.cssText="padding:1px;background:#cbd5e1";
        }
      });

      tblWrap.appendChild(tbl);sec.appendChild(tblWrap);wrap.appendChild(sec);
    });
  }

  ["cieds","abl"].forEach(d=>{
    const btn=document.createElement("button");btn.className="domain-tab"+(d===curD?" active":"");
    btn.textContent=d==="cieds"?"CIEDs（デバイス）":"ABL（アブレーション）";
    const ac="#0f3460";
    if(d===curD){btn.style.color=ac;btn.style.borderBottomColor=ac;}
    btn.onclick=()=>{
      curD=d;
      domTabs.querySelectorAll(".domain-tab").forEach(b=>{
        b.classList.toggle("active",b===btn);
        b.style.color=b===btn?ac:"#888";b.style.borderBottomColor=b===btn?ac:"#e2e8f0";
      });
      draw(d);
    };
    domTabs.appendChild(btn);
  });
  draw("cieds");
  container.appendChild(domTabs);container.appendChild(wrap);
}

// PDF出力（棒グラフ＋レーダーをSVGで生成）
// ═══════════════════════════════════════════════════════
function makeSVGBar(labels,values,maxVal,title,colors){
  const W=500,H=180,padL=90,padB=30,padT=30,padR=20;
  const bw=(W-padL-padR)/values.length-4;
  const ch=H-padT-padB;
  let bars=values.map((v,i)=>{
    const bh=v/maxVal*ch;
    const x=padL+i*(bw+4);
    const y=padT+ch-bh;
    const col=colors[i%colors.length];
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${col}" rx="3"/>
<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" fill="#374151">${v||""}</text>
<text x="${x+bw/2}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="#6b7280">${labels[i]||""}</text>`;
  }).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="font-family:sans-serif">
<text x="${W/2}" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">${title}</text>
<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#e2e8f0" stroke-width="1"/>
<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#e2e8f0" stroke-width="1"/>
${[0,.25,.5,.75,1].map(r=>{
  const y=padT+ch*(1-r);
  return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/>
<text x="${padL-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#94a3b8">${Math.round(maxVal*r)}</text>`;
}).join("")}
${bars}
</svg>`;
}

function makeSVGRadar(labels,datasets,title){
  const W=320,CX=160,CY=150,R=100,n=labels.length;
  const pts=i=>({
    x:CX+R*Math.sin(2*Math.PI*i/n),
    y:CY-R*Math.cos(2*Math.PI*i/n)
  });
  const axes=labels.map((_,i)=>{
    const p=pts(i);
    return `<line x1="${CX}" y1="${CY}" x2="${p.x}" y2="${p.y}" stroke="#e2e8f0" stroke-width="1"/>
<text x="${CX+(R+16)*Math.sin(2*Math.PI*i/n)}" y="${CY-(R+16)*Math.cos(2*Math.PI*i/n)+4}" text-anchor="middle" font-size="9" fill="#64748b">${labels[i]}</text>`;
  }).join("");
  const rings=[.25,.5,.75,1].map(r=>{
    const ps=labels.map((_,i)=>pts(i)).map(p=>({x:CX+(p.x-CX)*r,y:CY+(p.y-CY)*r}));
    return`<polygon points="${ps.map(p=>`${p.x},${p.y}`).join(" ")}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;
  }).join("");
  const polys=datasets.map(({values,color,label})=>{
    const ps=values.map((v,i)=>{const p=pts(i);const r=v/10;return{x:CX+(p.x-CX)*r,y:CY+(p.y-CY)*r};});
    return`<polygon points="${ps.map(p=>`${p.x},${p.y}`).join(" ")}" fill="${color}40" stroke="${color}" stroke-width="1.5"/>`;
  }).join("");
  const legend=datasets.map(({color,label},i)=>
    `<rect x="10" y="${i*16+10}" width="10" height="10" fill="${color}"/><text x="24" y="${i*16+19}" font-size="9" fill="#374151">${label}</text>`
  ).join("");
  return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${W}" style="font-family:sans-serif">
<text x="${CX}" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">${title}</text>
${rings}${axes}${polys}${legend}
</svg>`;
}

function printReport(idx){
  const p=S.staff[idx];
  const canSee=ROLE==="leader"||ROLE==="admin"||ROLE==="creator";
  const isAdmin=ROLE==="admin"||ROLE==="creator";
  const roleNote=isAdmin?"（自己/リーダー/上層部）":canSee?"（自己/リーダー）":"（自己評価のみ）";

  // ── SVGユーティリティ（凡例付き棒グラフ） ──────────────────
  function svgBar(labels,datasets,title,W=520,H=200){
    const padL=40,padB=40,padT=36,padR=20;
    const n=datasets.length,bTotal=labels.length;
    const groupW=(W-padL-padR)/bTotal;
    const bw=Math.max(4,(groupW-6)/n);
    const ch=H-padT-padB;
    const maxV=Math.max(...datasets.flatMap(d=>d.values),5);
    let bars="";
    datasets.forEach(({values,color,label},di)=>{
      values.forEach((v,li)=>{
        const bh=v/maxV*ch;
        const x=padL+li*groupW+di*(bw+2)+(groupW-n*(bw+2))/2;
        const y=padT+ch-bh;
        bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" rx="2"/>`;
        if(v>0)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-2).toFixed(1)}" text-anchor="middle" font-size="8" fill="#374151">${v}</text>`;
      });
    });
    const grid=[0,.25,.5,.75,1].map(r=>{
      const y=padT+ch*(1-r);
      return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/>
<text x="${padL-4}" y="${y+3}" text-anchor="end" font-size="8" fill="#94a3b8">${Math.round(maxV*r)}</text>`;
    }).join("");
    const xLabels=labels.map((l,i)=>`<text x="${(padL+i*groupW+groupW/2).toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="#6b7280">${l}</text>`).join("");
    const legend=datasets.map(({color,label},i)=>
      `<rect x="${padL+i*80}" y="${H-8}" width="10" height="8" fill="${color}"/><text x="${padL+i*80+13}" y="${H-1}" font-size="9" fill="#374151">${label}</text>`
    ).join("");
    return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H+20}" style="font-family:sans-serif">
<text x="${W/2}" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">${title}</text>
<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#e2e8f0"/>
<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#e2e8f0"/>
${grid}${bars}${xLabels}${legend}
</svg>`;
  }

  // ── レーダーチャート（凡例付き・最大値7） ──────────────────
  function svgRadar(labels,datasets,title,maxVal=7){
    const W=280,CX=130,CY=130,R=90,n=labels.length;
    if(n<3)return"";
    const pts=i=>({x:CX+R*Math.sin(2*Math.PI*i/n),y:CY-R*Math.cos(2*Math.PI*i/n)});
    const axes=labels.map((_,i)=>{const p=pts(i);return`<line x1="${CX}" y1="${CY}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/><text x="${(CX+(R+16)*Math.sin(2*Math.PI*i/n)).toFixed(1)}" y="${(CY-(R+16)*Math.cos(2*Math.PI*i/n)+4).toFixed(1)}" text-anchor="middle" font-size="9" fill="#64748b">${labels[i]}</text>`;}).join("");
    const rings=[.25,.5,.75,1].map(r=>{const ps=labels.map((_,i)=>pts(i)).map(p=>({x:CX+(p.x-CX)*r,y:CY+(p.y-CY)*r}));return`<polygon points="${ps.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;}).join("");
    const polys=datasets.map(({values,color,dash})=>{const ps=values.map((v,i)=>{const p=pts(i);const r=v/maxVal;return{x:CX+(p.x-CX)*r,y:CY+(p.y-CY)*r};});return`<polygon points="${ps.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="${color}30" stroke="${color}" stroke-width="1.5" ${dash?'stroke-dasharray="4,2"':""}/>`;}).join("");
    const legend=datasets.map(({color,label,dash},i)=>`<rect x="4" y="${i*16+4}" width="10" height="8" fill="${dash?"none":color}" stroke="${color}" ${dash?'stroke-dasharray="3,2"':""}/><text x="18" y="${i*16+12}" font-size="9" fill="#374151">${label}</text>`).join("");
    return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${W}" style="font-family:sans-serif">
<text x="${CX}" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">${title}</text>
${rings}${axes}${polys}<g transform="translate(0,${W-datasets.length*16-8})">${legend}</g></svg>`;
  }

  // ── スキルスコアテーブル（CIEDs・ABL・自己/リーダー/上層部） ──
  function scoreTable(domain,procs,makers,title){
    const rows=procs.map(proc=>`<tr><td style="padding:4px 8px;font-size:11px">${proc.label}</td>${makers.map(m=>{
      const valid=domain==="abl"?proc.sys.includes(m):ciedsValid(proc,m);
      if(!valid)return`<td style="text-align:center;color:#ccc">—</td>`;
      const s=calcSkillScore(p.self,domain,proc.id,m,p,true);
      const l=canSee?calcSkillScore(p.leader,domain,proc.id,m,p,false):null;
      const a=isAdmin?(p.admin?.[domain]?.[`${m}_${proc.id}`]?.target||0):null;
      const sl=SCORE_LEVELS;
      const fmt=v=>`<span style="background:${sl[v]?.color};color:${sl[v]?.text};padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700">${v}:${sl[v]?.label}</span>`;
      return`<td style="text-align:center;padding:3px;font-size:10px">${fmt(s)}${l!==null?`<br><span style="color:#059669;font-size:9px">L:${l}</span>`:""}${a!==null?`<span style="color:#7c3aed;font-size:9px"> T:${a}</span>`:""}</td>`;
    }).join("")}</tr>`).join("");
    return`<h2>${title}</h2><table><thead><tr><th>術式</th>${makers.map(m=>`<th>${m}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  // ── スキルスコアグラフ（棒グラフ＋レーダー） ─────────────────
  function scoreGraphs(domain,procs,makers,title){
    const labels=procs.map(proc=>proc.label);

    function validMakers(proc){
      return makers.filter(m=>domain==="abl"?proc.sys.includes(m):ciedsValid(proc,m));
    }
    function avgScore(evalObj,proc){
      const vm=validMakers(proc);
      if(!vm.length)return 0;
      return Math.round(vm.reduce((s,m)=>s+calcSkillScore(evalObj,domain,proc.id,m,p,evalObj===p.self),0)/vm.length*10)/10;
    }

    const datasets=[
      {label:"自己",   color:"#3b82f6",dash:false, values:procs.map(proc=>avgScore(p.self,  proc))},
    ];
    if(canSee) datasets.push({label:"リーダー",color:"#059669",dash:false, values:procs.map(proc=>avgScore(p.leader,proc))});
    if(isAdmin) datasets.push({label:"目標",   color:"#7c3aed",dash:true,
      values:procs.map(proc=>{
        const vm=validMakers(proc);
        if(!vm.length)return 0;
        return Math.round(vm.reduce((s,m)=>s+(p.admin?.[domain]?.[`${m}_${proc.id}`]?.target||0),0)/vm.length*10)/10;
      })
    });
    const bar=svgBar(labels,datasets.map(d=>({...d,values:d.values.map(v=>Math.round(v))})),`${title}（スキルスコア平均）`);
    // メーカー別レーダー
    const radars=makers.map(m=>{
      const validProcs=procs.filter(proc=>domain==="abl"?proc.sys.includes(m):ciedsValid(proc,m));
      if(validProcs.length<3)return"";
      const rData=[
        {label:"自己",color:"#3b82f6",dash:false,values:validProcs.map(proc=>calcSkillScore(p.self,domain,proc.id,m,p,true))},
      ];
      if(canSee)rData.push({label:"リーダー",color:"#059669",dash:false,values:validProcs.map(proc=>calcSkillScore(p.leader,domain,proc.id,m,p,false))});
      if(isAdmin)rData.push({label:"目標",color:"#7c3aed",dash:true,values:validProcs.map(proc=>p.admin?.[domain]?.[`${m}_${proc.id}`]?.target||0)});
      return svgRadar(validProcs.map(p=>p.label),rData,m,7);
    }).join("");
    return`${bar}<div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">${radars}</div>`;
  }

  // ── 症例数：年度×術式グラフ（メーカー/システム別） ───────────
  function casesGraphs(){
    const lc=p.leader.cases||{};
    const allYrs=Object.keys(lc).filter(k=>/^\d{4}$/.test(k)).sort();
    if(!allYrs.length)return`<p style="color:#94a3b8;font-size:11px">症例数データなし（リーダー未入力）</p>`;
    const yrs=allYrs.slice(-3); // 最新3年

    function makeGroupedBar(title,xLabels,series,getValue,W=700,H=280){
      const padL=50,padB=80,padT=40,padR=20;
      const ch=H-padT-padB, cw=W-padL-padR;
      const nG=xLabels.length, nS=series.length;
      const groupW=cw/nG;
      const bw=Math.max(4,(groupW-8)/nS);
      const allVals=xLabels.flatMap(x=>series.map(s=>getValue(x,s.id)||0));
      const maxV=Math.max(...allVals,5);

      let bars="",xLbls="",bgBands="",dividers="";

      // 年度ごとの背景色交互・区切り線
      xLabels.forEach((x,gi)=>{
        const gx=padL+gi*groupW;
        // 背景帯（交互）
        const bgColor=gi%2===0?"#f8faff":"#ffffff";
        bgBands+=`<rect x="${gx.toFixed(1)}" y="${padT}" width="${groupW.toFixed(1)}" height="${ch}" fill="${bgColor}"/>`;
        // 右側に区切り線（最後以外）
        if(gi<nG-1){
          dividers+=`<line x1="${(gx+groupW).toFixed(1)}" y1="${padT}" x2="${(gx+groupW).toFixed(1)}" y2="${(H-padB)}" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        }
        // 年度ラベル（グループ中央・太字）
        xLbls+=`<text x="${(gx+groupW/2).toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">${x}年</text>`;
      });

      // バー
      xLabels.forEach((x,gi)=>{
        const gx=padL+gi*groupW;
        series.forEach(({id,color},si)=>{
          const v=getValue(x,id)||0;
          const bh=v/maxV*ch;
          const bx=gx+(groupW-nS*(bw+1))/2+si*(bw+1);
          const by=padT+ch-bh;
          bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" fill="${color}" rx="2" opacity="0.85"/>`;
          if(v>0&&bw>14)bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${(by-2).toFixed(1)}" text-anchor="middle" font-size="8" fill="#374151">${v}</text>`;
        });
      });

      const grid=[0,.25,.5,.75,1].map(r=>{
        const y=padT+ch*(1-r);
        return`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
<text x="${padL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${Math.round(maxV*r)}</text>`;
      }).join("");

      // 凡例（下部・複数行）
      const legCols=Math.min(nS,4);
      const legRows=Math.ceil(nS/legCols);
      const colW=(W-padL-padR)/legCols;
      const legend=series.map(({label,color},i)=>{
        const col=i%legCols, row=Math.floor(i/legCols);
        const lx=padL+col*colW;
        const ly=H-padB+30+row*16;
        return`<rect x="${lx}" y="${ly}" width="10" height="9" fill="${color}" rx="1"/><text x="${lx+14}" y="${ly+9}" font-size="9" fill="#374151">${label}</text>`;
      }).join("");

      const totalH=H+legRows*16;
      return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${totalH}" style="font-family:sans-serif;display:block">
<text x="${W/2}" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">${title}</text>
${bgBands}
<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
${grid}${dividers}${bars}${xLbls}${legend}
</svg>`;
    }

    // CIEDs：メーカー別に1グラフ（X軸=年度、凡例=術式）
    const CIEDS_COLORS=["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6"];
    const ciedsSeries=CIEDS_PROCS.map((proc,i)=>({id:proc.id,label:proc.label,color:CIEDS_COLORS[i]}));

    const ciedsHtml=CIEDS_MAKERS.map(maker=>{
      const mainG=makeGroupedBar(
        `${maker} — メイン件数`,yrs,
        ciedsSeries.filter(s=>ciedsValid(CIEDS_PROCS.find(pp=>pp.id===s.id),maker)),
        (yr,procId)=>parseInt(lc[yr]?.cieds?.[`${maker}_${procId}`]?.main||0)||0
      );
      const subG=makeGroupedBar(
        `${maker} — 外回り件数`,yrs,
        ciedsSeries.filter(s=>ciedsValid(CIEDS_PROCS.find(pp=>pp.id===s.id),maker)),
        (yr,procId)=>parseInt(lc[yr]?.cieds?.[`${maker}_${procId}`]?.sub||0)||0
      );
      return`<div style="margin-bottom:20px"><div style="display:flex;gap:20px;flex-wrap:wrap">${mainG}${subG}</div></div>`;
    }).join("");

    // ABL：システム別に1グラフ（X軸=年度、凡例=術式）
    const ABL_COLORS=["#6366f1","#ec4899","#14b8a6","#f97316","#84cc16","#a855f7","#06b6d4","#f43f5e"];
    const ablSeries=ABL_CASES_PROCS.map((proc,i)=>({id:proc.id,label:proc.label,color:ABL_COLORS[i]}));

    const ablHtml=ABL_SYSTEMS.map(sys=>{
      const validSeries=ablSeries.filter(s=>ABL_CASES_PROCS.find(pp=>pp.id===s.id)?.sys.includes(sys));
      const mainG=makeGroupedBar(
        `${sys} — メイン件数`,yrs,validSeries,
        (yr,procId)=>parseInt(lc[yr]?.abl?.[`${sys}_${procId}`]?.main||0)||0
      );
      const subG=makeGroupedBar(
        `${sys} — 外回り件数`,yrs,validSeries,
        (yr,procId)=>parseInt(lc[yr]?.abl?.[`${sys}_${procId}`]?.sub||0)||0
      );
      return`<div style="margin-bottom:20px"><div style="display:flex;gap:20px;flex-wrap:wrap">${mainG}${subG}</div></div>`;
    }).join("");

    return`<h2>症例数グラフ — CIEDs（X軸：年度　色：術式　最新${yrs.length}年）</h2>${ciedsHtml}
<h2>症例数グラフ — ABL（X軸：年度　色：術式　最新${yrs.length}年）</h2>${ablHtml}`;
  }

  // ── 症例数テーブル ────────────────────────────────────────
  function casesTable(domain,procs,makers,title){
    const lc=p.leader.cases||{};
    const yrs=Object.keys(lc).filter(k=>/^\d{4}$/.test(k)).sort();
    if(!yrs.length)return`<h2>${title}</h2><p style="color:#94a3b8;font-size:11px">症例数データなし（リーダー未入力）</p>`;
    return yrs.map(y=>`
    <h2>${title} — ${y}年度</h2>
    <table><thead><tr><th>術式</th>${makers.map(m=>`<th colspan="2">${m}<br><span style="font-size:8px;font-weight:400">M/外</span></th>`).join("")}</tr></thead><tbody>
    ${procs.map(proc=>`<tr><td style="font-size:11px;padding:3px 6px">${proc.label}</td>${makers.map(m=>{
      const valid=domain==="abl"?proc.sys.includes(m):ciedsValid(proc,m);
      if(!valid)return`<td colspan="2" style="text-align:center;color:#ccc;font-size:10px">—</td>`;
      const key=`${m}_${proc.id}`;
      const v=lc[y]?.[domain]?.[key]||{main:"−",sub:"−"};
      return`<td style="text-align:center;font-size:10px">${v.main||"−"}</td><td style="text-align:center;font-size:10px;color:#475569">${v.sub||"−"}</td>`;
    }).join("")}</tr>`).join("")}
    </tbody></table>`).join("");
  }

  // ── 月別症例数グラフ（PDF用SVG文字列）────────────────────
  function monthlyGraphsSVG(){
    const mc=p.leader.monthlyCases||{};
    const months=Object.keys(mc).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();
    if(!months.length)return"";
    const xLabels=months.map(m=>m.replace("-","年")+"月");

    function mkSVGStr(title,datasets,W=680,H=220){
      const padL=50,padB=60,padT=36,padR=20;
      const ch=H-padT-padB,cw=W-padL-padR;
      const nG=xLabels.length,nS=datasets.length;
      const groupW=cw/nG,bw=Math.max(4,(groupW-8)/nS);
      const maxV=Math.max(...datasets.flatMap(d=>d.values),5);
      let bars="",xLbls="",bg="",div="";
      xLabels.forEach((x,gi)=>{
        const gx=padL+gi*groupW;
        bg+=`<rect x="${gx.toFixed(1)}" y="${padT}" width="${groupW.toFixed(1)}" height="${ch}" fill="${gi%2===0?'#f8faff':'#fff'}"/>`;
        if(gi<nG-1) div+=`<line x1="${(gx+groupW).toFixed(1)}" y1="${padT}" x2="${(gx+groupW).toFixed(1)}" y2="${H-padB}" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>`;
        xLbls+=`<text x="${(gx+groupW/2).toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="9" font-weight="600" fill="#374151">${x}</text>`;
      });
      datasets.forEach(({values,color},di)=>{
        xLabels.forEach((_,gi)=>{
          const v=values[gi]||0,bh=v/maxV*ch;
          const bx=padL+gi*groupW+(groupW-nS*(bw+1))/2+di*(bw+1),by=padT+ch-bh;
          bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" fill="${color}" rx="1" opacity="0.85"/>`;
          if(v>0&&bw>12) bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${(by-2).toFixed(1)}" text-anchor="middle" font-size="7" fill="#374151">${v}</text>`;
        });
      });
      const grid=[0,.5,1].map(r=>{const y=padT+ch*(1-r);return`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/><text x="${padL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#94a3b8">${Math.round(maxV*r)}</text>`;}).join("");
      const legend=datasets.map(({label,color},i)=>`<rect x="${padL+i*80}" y="${H-padB+28}" width="9" height="7" fill="${color}" rx="1"/><text x="${padL+i*80+12}" y="${H-padB+35}" font-size="8" fill="#374151">${label}</text>`).join("");
      return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H+40}" style="font-family:sans-serif;display:block">
<text x="${W/2}" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">${title}</text>
${bg}<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#94a3b8" stroke-width="1.5"/>
${grid}${div}${bars}${xLbls}${legend}</svg>`;
    }

    function getVal(mo,domain,key,field){ return parseInt(mc[mo]?.[domain]?.[key]?.[field]||0)||0; }

    // CIEDs合計
    const cMain=months.map(mo=>CIEDS_MAKERS.reduce((s,maker)=>s+CIEDS_PROCS.reduce((ss,pr)=>ss+(ciedsValid(pr,maker)?getVal(mo,"cieds",`${maker}_${pr.id}`,"main"):0),0),0));
    const cSub =months.map(mo=>CIEDS_MAKERS.reduce((s,maker)=>s+CIEDS_PROCS.reduce((ss,pr)=>ss+(ciedsValid(pr,maker)?getVal(mo,"cieds",`${maker}_${pr.id}`,"sub"):0),0),0));
    const ciedsTotal=mkSVGStr("CIEDs 月別合計",[{label:"メイン",color:"#3b82f6",values:cMain},{label:"外回り",color:"#94a3b8",values:cSub}]);

    // ABL合計
    const aMain=months.map(mo=>ABL_SYSTEMS.reduce((s,sys)=>s+ABL_CASES_PROCS.reduce((ss,pr)=>ss+(pr.sys.includes(sys)?getVal(mo,"abl",`${sys}_${pr.id}`,"main"):0),0),0));
    const aSub =months.map(mo=>ABL_SYSTEMS.reduce((s,sys)=>s+ABL_CASES_PROCS.reduce((ss,pr)=>ss+(pr.sys.includes(sys)?getVal(mo,"abl",`${sys}_${pr.id}`,"sub"):0),0),0));
    const ablTotal=mkSVGStr("ABL 月別合計",[{label:"メイン",color:"#7c3aed",values:aMain},{label:"外回り",color:"#94a3b8",values:aSub}]);

    // CIEDsメーカー別
    const ciedsmakers=CIEDS_MAKERS.map(maker=>{
      const mv=months.map(mo=>CIEDS_PROCS.reduce((s,pr)=>s+(ciedsValid(pr,maker)?getVal(mo,"cieds",`${maker}_${pr.id}`,"main"):0),0));
      const sv=months.map(mo=>CIEDS_PROCS.reduce((s,pr)=>s+(ciedsValid(pr,maker)?getVal(mo,"cieds",`${maker}_${pr.id}`,"sub"):0),0));
      return mkSVGStr(`CIEDs ${maker}（月別）`,[{label:"メイン",color:"#3b82f6",values:mv},{label:"外回り",color:"#94a3b8",values:sv}],460,180);
    }).join("");

    // ABLシステム別
    const ablsys=ABL_SYSTEMS.map(sys=>{
      const vp=ABL_CASES_PROCS.filter(pr=>pr.sys.includes(sys));
      const mv=months.map(mo=>vp.reduce((s,pr)=>s+getVal(mo,"abl",`${sys}_${pr.id}`,"main"),0));
      const sv=months.map(mo=>vp.reduce((s,pr)=>s+getVal(mo,"abl",`${sys}_${pr.id}`,"sub"),0));
      return mkSVGStr(`ABL ${sys}（月別）`,[{label:"メイン",color:"#7c3aed",values:mv},{label:"外回り",color:"#94a3b8",values:sv}],460,180);
    }).join("");

    return`<h2>月別症例数グラフ — 合計</h2>

function showTab(t,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.remove("active"));
  const pg=document.getElementById("page-"+t);if(pg)pg.classList.add("active");
  if(btn)btn.classList.add("active");

  if(t==="dashboard"){const c=document.getElementById("dashboardContent");if(c)buildDashboard(c);}
  if(t==="analysis"){const c=document.getElementById("analysisContent");if(c)buildTeamAnalysis(c);}
  if(t==="seminar")renderSeminar();
}


// ═══════════════════════════════════════════════════════
// 評価サイクルリマインド（E-1）
// ═══════════════════════════════════════════════════════
function renderReminder(){
  const old=document.getElementById("reminderBar");
  if(old) old.remove();
  if(ROLE==="self") return; // パスワード入力者のみ

  const alerts=[];
  const today=new Date();

  S.staff.forEach(p=>{
    // ① 最終評価日から3ヶ月経過チェック
    const lastUpd=p.leader?._updatedAt;
    if(lastUpd){
      const d=new Date(lastUpd.replace(/\//g,"-"));
      const days=Math.floor((today-d)/(1000*60*60*24));
      if(days>=90) alerts.push({type:"eval",name:p.name,msg:`最終評価から${days}日経過（要再評価）`,color:"#ea580c"});
    }else{
      alerts.push({type:"eval",name:p.name,msg:"リーダー評価が未実施",color:"#dc2626"});
    }
    // ② 期限切れ目標
    ["cieds","abl"].forEach(domain=>{
      const g=p.admin?.[domain]||{};
      Object.entries(g).forEach(([key,gv])=>{
        if(!gv?.target||!gv.deadline)return;
        const dl=new Date(gv.deadline);
        const daysLeft=Math.ceil((dl-today)/(1000*60*60*24));
        const [maker,...pp]=key.split("_");
        const procId=pp.join("_");
        const procs=domain==="cieds"?CIEDS_PROCS:ABL_PROCS;
        const proc=procs.find(x=>x.id===procId);
        if(!proc)return;
        const cur=calcSkillScore(p.leader,domain,procId,maker,p,false);
        if(cur>=gv.target)return; // 達成済み
        if(daysLeft<0) alerts.push({type:"goal",name:p.name,msg:`${proc.label}×${maker} 目標期限超過（${-daysLeft}日）`,color:"#dc2626"});
        else if(daysLeft<=30) alerts.push({type:"goal",name:p.name,msg:`${proc.label}×${maker} 目標期限まで${daysLeft}日`,color:"#ea580c"});
      });
    });
  });

  if(!alerts.length) return;

  const bar=document.createElement("div");
  bar.id="reminderBar";
  bar.style.cssText="background:#fffbeb;border:1px solid #fbbf24;border-radius:8px;padding:10px 14px;margin:8px 12px";
  const hdr=document.createElement("div");
  hdr.style.cssText="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;color:#92400e";
  hdr.innerHTML=`<span>対応が必要な項目 ${alerts.length}件</span><span style="margin-left:auto;font-size:11px">▼</span>`;
  const list=document.createElement("div");
  list.style.cssText="display:none;margin-top:8px;max-height:200px;overflow-y:auto";
  alerts.slice(0,30).forEach(a=>{
    const item=document.createElement("div");
    item.style.cssText=`font-size:11px;padding:4px 8px;border-left:3px solid ${a.color};margin-bottom:4px;background:#fff;border-radius:0 4px 4px 0`;
    item.innerHTML=`<b style="color:#1a1a2e">${a.name}</b>　<span style="color:${a.color}">${a.msg}</span>`;
    list.appendChild(item);
  });
  hdr.onclick=()=>{
    const open=list.style.display!=="none";
    list.style.display=open?"none":"block";
    hdr.querySelector("span:last-child").textContent=open?"▼":"▲";
  };
  bar.appendChild(hdr);bar.appendChild(list);

  const tabs=document.getElementById("tabs");
  if(tabs&&tabs.parentNode) tabs.parentNode.insertBefore(bar,tabs.nextSibling);
}

// 初期化
// ═══════════════════════════════════════════════════════

// ① まずLocalStorageから即時読み込みして描画（待機なし）
const _vBadge = document.getElementById("versionBadge");
if(_vBadge) _vBadge.textContent = APP_VERSION;
const _lsRaw = localStorage.getItem(LS_KEY);
if(_lsRaw){
  try{
    const parsed = JSON.parse(_lsRaw);
    if(repairState(parsed)){
      S = parsed;
    } else {
      // 修復失敗 → 初期データで上書き
      S = {staff:JSON.parse(JSON.stringify(INIT_STAFF)), benchmark:mkCases()};
    }
  }catch(e){
    S = {staff:JSON.parse(JSON.stringify(INIT_STAFF)), benchmark:mkCases()};
  }
} else {
  // LocalStorageにデータなし → 初期データをセット
  S = {staff:JSON.parse(JSON.stringify(INIT_STAFF)), benchmark:mkCases()};
}
applyRole();
loadSeminarData();
renderAll();

// ② Firebase SDKのロードを非同期で待機（最大5秒）
//    ロード完了したらリスナーをセット
let _initWait = 0;
const _initTimer = setInterval(()=>{
  _initWait += 100;
  if(typeof window._fbListen === "function" || _initWait >= 5000){
    clearInterval(_initTimer);
    if(typeof window._fbListen === "function"){
      // Firebaseリスナー登録（他PCからの変更を受信）
      window._fbListen(data => {
        if(!repairState(data)) return;
        localStorage.setItem(LS_KEY, JSON.stringify(data));
        const isEcho = (Date.now() - _lastSaveTime) < ECHO_GUARD_MS;
        if(!_fbReady){
          S = data;
          _fbReady = true;
          setSyncStatus("synced");
          renderAll();
        } else if(!isEcho){
          // 他のPCからの変更のみ再描画（自分の保存後5秒以内は無視）
          S = data;
          renderAll();
        }
        // エコーバック期間中はデータ更新なし（自分のSをそのまま維持）
      });
    } else {
      setSyncStatus("error");
      console.warn("Firebase未接続 - ローカルモードで動作");
    }
  }
}, 100);
</script>
